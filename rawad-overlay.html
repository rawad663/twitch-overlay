      };

      /* ── scale the 1920×1080 stage to whatever the source is sized at ── */
      const stage = document.getElementById("stage");
      function fit() {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        stage.style.transform = `scale(${s})`;
        stage.style.left = (innerWidth - 1920 * s) / 2 + "px";
      }
      addEventListener("resize", fit);
      fit();

      const qs = new URLSearchParams(location.search);
      const inOBS = !!window.obsstudio;
      if (qs.get("guide") === "1") document.body.classList.add("guide");
      // Outside OBS, show a backdrop and fake traffic so you can preview it in a browser.
      const DEMO = qs.get("demo") === "1" || (!inOBS && qs.get("live") !== "1");
      if (DEMO) document.body.classList.add("bg");

      /* Scene mode turns this same file into the full-screen AFK/BRB view for a
         second OBS source. No ?mode= at all leaves the HUD exactly as it was. */
      const MODE = (qs.get("mode") || "").toLowerCase();
      const SCENE = MODE === "afk" || MODE === "brb" || MODE === "scene";
      if (SCENE) document.body.classList.add("scene");

      /* ═══════════════════ CONTROL BUS ═══════════════════
         Links this source to admin.html. Same-origin only, which in practice
         means the panel must be an OBS *Custom Browser Dock* — a normal Chrome
         tab is a different browser and shares nothing.

         Three redundant mechanisms, deduped by id, because OBS has a history of
         breaking one or another between docks and sources:
           1. BroadcastChannel  2. storage events  3. polling the same key    */
      const BUS_KEY = "rawad-control-msg";
      const BUILD = "bus-1"; // bumped when the bus contract changes; shown in admin diagnostics
      const Bus = {
        id: Math.random().toString(36).slice(2),
        ch: null,
        seen: [],
        handlers: {},
        lastId: "",

        init() {
          try {
            this.ch = new BroadcastChannel("rawad-control");
            this.ch.onmessage = (e) => this.deliver(e.data);
          } catch (e) {}

          addEventListener("storage", (e) => {
            if (e.key !== BUS_KEY || !e.newValue) return;
            try {
              this.deliver(JSON.parse(e.newValue));
            } catch (_) {}
          });

          // covers storage events not firing across CEF views
          setInterval(() => {
            let raw;
            try {
              raw = localStorage.getItem(BUS_KEY);
            } catch (_) {
              return;
            }
            if (!raw) return;
            try {
              const m = JSON.parse(raw);
              if (m && m.id !== this.lastId) {
                this.lastId = m.id;
                this.deliver(m);
              }
            } catch (_) {}
          }, 500);
          return this;
        },

        send(type, payload) {
          const msg = {
            v: 1,
            id: this.id + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            ts: Date.now(),
            from: this.id,
            type,
            payload: payload || {},
          };
          try {
            if (this.ch) this.ch.postMessage(msg);
          } catch (e) {}
          try {
            localStorage.setItem(BUS_KEY, JSON.stringify(msg));
          } catch (e) {}
        },

        on(type, fn) {
          (this.handlers[type] = this.handlers[type] || []).push(fn);
          return this;
        },

        deliver(msg) {
          if (!msg || msg.v !== 1 || msg.from === this.id) return; // ignore our own
          if (this.seen.indexOf(msg.id) !== -1) return;
          this.seen.push(msg.id);
          if (this.seen.length > 200) this.seen.splice(0, 100);
          (this.handlers[msg.type] || []).forEach((fn) => {
            try {
              fn(msg.payload, msg);
            } catch (e) {}
          });
        },
      };

      /* what the panel's status section reports on — updated in place */
      const Status = {
        irc: "connecting",
        eventsub: "off",
        token: false,
      };

      /* Secrets never live in this file — the repo is public. The token is
         passed in the OBS browser-source URL, which stays on your machine. */
      const TOKEN = qs.get("token") || "";
      const CLIENT_ID = qs.get("client_id") || CONFIG.clientId;
      const MUTED = qs.get("mute") === "1";
      Status.token = !!TOKEN;
      Status.eventsub = TOKEN && CLIENT_ID ? "connecting" : "off";
      if (qs.has("volume")) {
        const v = parseFloat(qs.get("volume"));
        if (!isNaN(v)) CONFIG.volume = Math.max(0, Math.min(1, v));
      }

      /* ── OAuth helper ──
         After the Twitch authorize redirect, the token lands in the URL
         *fragment* (#access_token=...), not a query param, and Twitch never
         sends it back through anything but the browser — so this has to
         happen client-side. Detect it, build the ready-to-paste OBS URL, and
         scrub the token out of the address bar the moment it's read. */
      (function oauthHelper() {
        const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
        const token = hash.get("access_token");
        if (!token) return;
        history.replaceState(null, "", location.pathname + location.search);

        const savedClientId = localStorage.getItem("rawad-clientid") || "";
        const box = document.createElement("div");
        box.id = "oauthHelper";
        box.innerHTML =
          '<div class="card">' +
          "<h1>Follow-alert token ready</h1>" +
          '<label>Client ID<input id="ohClientId" spellcheck="false" placeholder="paste your Client ID"></label>' +
          '<label>OBS browser-source URL<textarea id="ohUrl" readonly spellcheck="false"></textarea></label>' +
          '<button id="ohCopy" type="button">Copy URL</button>' +
          '<p class="hint">Paste this whole URL into OBS’s browser source. The token expires in ~60 days.</p>' +
          "</div>";
        document.body.appendChild(box);

        const idInput = box.querySelector("#ohClientId");
        const urlBox = box.querySelector("#ohUrl");
        const copyBtn = box.querySelector("#ohCopy");
        idInput.value = savedClientId;

        function rebuild() {
          const cid = idInput.value.trim();
          if (cid) localStorage.setItem("rawad-clientid", cid);
          const base = location.origin + location.pathname;
          urlBox.value =
            base +
            "?live=1&client_id=" +
            encodeURIComponent(cid || "YOUR_CLIENT_ID") +
            "&token=" +
            encodeURIComponent(token);
        }
        idInput.addEventListener("input", rebuild);
        copyBtn.addEventListener("click", () => {
          urlBox.select();
          navigator.clipboard
            .writeText(urlBox.value)
            .then(() => (copyBtn.textContent = "Copied!"))
            .catch(() => document.execCommand("copy"));
          setTimeout(() => (copyBtn.textContent = "Copy URL"), 1600);
        });
        rebuild();
      })();

      /* ── rail tick marks ── */
      {
        const t = document.getElementById("ticks");
        for (let i = 0; i < 26; i++) {
          const el = document.createElement("i");
          el.style.top = i * 3.85 + "%";
          el.style.width = (i % 5 === 0 ? 13 : 6) + "px";
          el.style.opacity = i % 5 === 0 ? 0.8 : 0.32;
          t.appendChild(el);
        }
      }

      /* ── session clock ── */
      const t0 = Date.now(),
        clock = document.getElementById("clock");
      setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000);
        clock.textContent = [s / 3600, (s / 60) % 60, s % 60]
          .map((n) => String(Math.floor(n)).padStart(2, "0"))
          .join(":");
      }, 1000);

      /* ═══════════════════ THE MOON (chat energy meter) ═══════════════════ */
      const PHASES = [
        "New moon",
        "Waxing crescent",
        "First quarter",
        "Waxing gibbous",
        "Full moon",
      ];
      const shadow = document.getElementById("shadow");
      const fill = document.getElementById("fill");
      const phaseName = document.getElementById("phaseName");
      const moonWrap = document.getElementById("moonWrap");
      const quietHint = document.getElementById("quietHint");
      let beats = [],
        fullUntil = 0;

      /* ── quiet-chat hint ── */
      const QUIET_THRESHOLD = 0.25;
      const QUIET_HOLD_MS = 30000;
      const QUIET_GRACE_MS = 45000;
      let quietStart = null,
        hintVisible = false;

      function hintSuppressed() {
        // stay down while anything is queued, not just while one is animating
        return Director.active() || pollEl.classList.contains("on");
      }
      function showHint() {
        hintVisible = true;
        quietHint.classList.add("show");
      }
      function hideHint() {
        hintVisible = false;
        quietHint.classList.remove("show");
      }
      function updateHint(p, now) {
        if (p >= QUIET_THRESHOLD) {
          if (hintVisible) hideHint();
          quietStart = null;
          return;
        }
        if (quietStart === null) quietStart = now;

        const suppressed = hintSuppressed();
        if (hintVisible) {
          if (suppressed) {
            hideHint();
            quietStart = now; // 30s timer restarts from zero
          }
          return;
        }
        const pastGrace = now - t0 >= QUIET_GRACE_MS;
        if (pastGrace && !suppressed && now - quietStart >= QUIET_HOLD_MS) {
          showHint();
        }
      }

      function ping() {
        beats.push(Date.now());
      }

      function drawMoon() {
        const now = Date.now();
        beats = beats.filter((t) => now - t < 60000);
        const p = Math.min(1, beats.length / CONFIG.fullMoonMessages);

        shadow.setAttribute("cx", 26 + p * 40); // slide the shadow off → waxing
        fill.style.width = p * 100 + "%";
        phaseName.textContent = PHASES[Math.min(4, Math.floor(p * 4.999))];
        updateHint(p, now);

        if (p >= 1 && now > fullUntil) {
          fullUntil = now + 20000;
          moonWrap.classList.add("full");
          setTimeout(() => moonWrap.classList.remove("full"), 1700);
          say(
            "The moon is full.",
            "Chat lit it up — " + beats.length + " messages this minute."
          );
        }
      }
      setInterval(drawMoon, 900);

      /* ═══════════════════ ORACLE (!fate) ═══════════════════ */
      const FATES = [
        "The next rare you touch is worth more than you think. Sell it.",
        "Something in your stash has been waiting three leagues to be useful.",
        "You will die to a mechanic you have explained to chat before.",
        "Turn around. You walked past it.",
        "Your next six maps are quiet. The seventh is not.",
        "The build works. The pilot is the variable.",
        "Greed costs one portal tonight. Spend it early.",
        "A currency drop lands while you are reading this.",
        "You have enough regrets. Craft the item.",
        "The map you keep skipping holds the good one.",
        "Someone in chat is about to say the thing you needed to hear.",
        "Your gear is fine. Your resistances are not.",
        "Trade offer incoming. Take it.",
        "The boss dies this attempt if you stop dodging backwards.",
        "You are two levels from the passive that fixes everything.",
        "Log off one map later than you planned. Just one.",
        "A stranger will vouch for you tonight.",
        "That vendor recipe you forgot is worth doing.",
        "Nothing rare drops for an hour. Then everything does.",
        "The loot filter is hiding it from you on purpose.",
        "Your hideout is fine. Nobody is judging it. Some are.",
        "Patience, then violence. In that order.",
        "You will misclick something expensive. Breathe first.",
        "The moon says: hydrate, then run one more.",
      ];
      const oracle = document.getElementById("oracle");
      const oWho = document.getElementById("oWho");
      const oLine = document.getElementById("oLine");
      let fateLog = new Map();

      const pick = (a) => a[(Math.random() * a.length) | 0];
      // usernames come from chat — always escape before touching innerHTML
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c]
        );
      const b = (s) => "<b>" + esc(s) + "</b>";

      /* ═══════════════════ SOUND (synthesised — no files) ═══════════════════
         Bell-ish tones from a minor pentatonic set, so alerts sound like the
         rest of the overlay looks. Only subs and above make noise; follows,
         small cheers and fates stay silent so audio still means something. */
      const Sound = {
        ctx: null,
        vol: CONFIG.volume,
        muted: MUTED,

        ready() {
          if (this.muted) return null;
          try {
            if (!this.ctx) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return null;
              this.ctx = new AC();
            }
            // OBS autoplays fine; a normal browser tab stays suspended till a click
            if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
            return this.ctx.state === "running" ? this.ctx : null;
          } catch (e) {
            return null;
          }
        },

        // one struck bell: fundamental + two quieter partials, exponential decay
        bell(ctx, freq, at, dur, gain) {
          const t = ctx.currentTime + at;
          [
            [1, 1],
            [2.01, 0.34], // slightly sharp — gives the shimmer
            [3.02, 0.14],
          ].forEach(([mult, amp]) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = "sine";
            o.frequency.value = freq * mult;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(
              Math.max(0.0002, gain * amp * this.vol),
              t + 0.012
            );
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(ctx.destination);
            o.start(t);
            o.stop(t + dur + 0.05);
          });
        },

        // low rising swell, used to make a raid feel like weather
        swell(ctx, at, dur) {
          const t = ctx.currentTime + at;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "triangle";
          o.frequency.setValueAtTime(82, t);
          o.frequency.exponentialRampToValueAtTime(220, t + dur);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.28 * this.vol, t + dur * 0.6);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g).connect(ctx.destination);
          o.start(t);
          o.stop(t + dur + 0.05);
        },

        play(name) {
          if (!name) return;
          const ctx = this.ready();
          if (!ctx) return;
          const A3 = 220,
            C4 = 261.63,
            D4 = 293.66,
            E4 = 329.63,
            G4 = 392,
            A4 = 440,
            E5 = 659.25;
          try {
            if (name === "sub") {
              this.bell(ctx, A3, 0, 1.7, 0.3);
              this.bell(ctx, C4, 0.13, 1.7, 0.3);
              this.bell(ctx, E4, 0.26, 2.1, 0.32);
            } else if (name === "gift") {
              this.bell(ctx, A3, 0, 1.7, 0.3);
              this.bell(ctx, C4, 0.13, 1.7, 0.3);
              this.bell(ctx, E4, 0.26, 2.1, 0.32);
              this.bell(ctx, A4, 0.42, 2.4, 0.2); // extra shimmer on top
            } else if (name === "massgift") {
              [A3, C4, E4, A4].forEach((f, i) =>
                this.bell(ctx, f, i * 0.04, 2.6, 0.26)
              );
              this.bell(ctx, E5, 0.5, 2.6, 0.16);
            } else if (name === "raid") {
              this.swell(ctx, 0, 1.1);
              this.bell(ctx, A4, 0.9, 2.4, 0.3);
              this.bell(ctx, E5, 1.05, 2.6, 0.22);
            } else if (name === "cheer") {
              this.bell(ctx, E4, 0, 0.9, 0.24);
              this.bell(ctx, G4, 0.09, 0.9, 0.24);
              this.bell(ctx, A4, 0.18, 1.3, 0.26);
            }
          } catch (e) {
            /* never let audio break the overlay */
          }
        },
      };

      /* ═══════════════════ THE DIRECTOR ═══════════════════
         One queue, one banner element — so two alerts can never stack. Every
         banner in the overlay (alerts, fates, poll results) goes through here. */
      const TIERS = {
        raid: { prio: 50, dur: 8500, sound: "raid" },
        massgift: { prio: 45, dur: 8000, sound: "massgift" },
        sub: { prio: 40, dur: 7000, sound: "sub" },
        gift: { prio: 40, dur: 7000, sound: "gift" },
        bigcheer: { prio: 35, dur: 7000, sound: "cheer", tier: "cheer" },
        cheer: { prio: 20, dur: 5500, sound: null, tier: "cheer" },
        follow: { prio: 15, dur: 4500, sound: null },
        system: { prio: 10, dur: 9400, sound: null, tier: null },
      };

      /* Events that land together should play in priority order, but priority
         only sorts what's already queued — so hold briefly before the first
         banner and let a burst settle. Imperceptible live; the difference
         between a raid leading and a stray follow blocking it for 4.5s. */
      const SETTLE = 250,
        SETTLE_MAX = 550;

      const Director = {
        q: [],
        showing: null,
        lastEnd: 0,
        timer: null,
        lastPush: 0,
        firstPending: 0,

        active() {
          return !!this.showing || this.q.length > 0;
        },

        push(type, who, html, extra) {
          const spec = TIERS[type] || TIERS.system;
          const evt = Object.assign(
            {
              type,
              who,
              html,
              prio: spec.prio,
              dur: spec.dur,
              sound: spec.sound,
              tier: "tier" in spec ? spec.tier : type,
            },
            extra || {}
          );

          const now = Date.now();
          this.lastPush = now;
          if (!this.q.length && !this.showing) this.firstPending = now;

          // insert by priority, FIFO within a priority
          let i = this.q.findIndex((e) => e.prio < evt.prio);
          if (i === -1) this.q.push(evt);
          else this.q.splice(i, 0, evt);

          // over cap, shed the least important — a sub/gift/raid is never dropped
          while (this.q.length > CONFIG.queueCap) {
            let lowest = 0;
            for (let j = 1; j < this.q.length; j++)
              if (this.q[j].prio <= this.q[lowest].prio) lowest = j;
            this.q.splice(lowest, 1);
          }

          this.pump();
          return evt;
        },

        pump() {
          if (this.showing || this.timer || !this.q.length) return;
          const now = Date.now();
          // breathing room after the last banner, and a moment for bursts to settle
          const settleTo = Math.min(
            this.lastPush + SETTLE,
            this.firstPending + SETTLE_MAX
          );
          const wait = Math.max(
            0,
            this.lastEnd + CONFIG.alertGap - now,
            settleTo - now
          );
          if (wait > 0) {
            this.timer = setTimeout(() => {
              this.timer = null;
              this.pump();
            }, wait);
            return;
          }
          this.render(this.q.shift());
        },

        render(evt) {
          this.showing = evt;
          oWho.textContent = evt.who;
          oLine.innerHTML = evt.html;
          oracle.className = ""; // drop any previous tier + restart the animation
          void oracle.offsetWidth;
          if (evt.tier) oracle.classList.add("t-" + evt.tier);
          if (pollEl.classList.contains("on")) oracle.classList.add("lowered");
          oracle.style.animationDuration = evt.dur + "ms";
          oracle.classList.add("on");
          Sound.play(evt.sound);

          setTimeout(() => {
            this.showing = null;
            this.lastEnd = Date.now();
            oracle.classList.remove("on");
            this.pump();
          }, evt.dur);
        },
      };

      /* say() keeps its old shape so the moon, polls and !say still work */
      function say(who, line) {
        Director.push("system", who, esc(line));
        return true;
      }

      function fate(user) {
        const now = Date.now();
        if (now - (fateLog.get(user) || 0) < CONFIG.fateCooldown * 1000) return;
        fateLog.set(user, now);
        Director.push(
          "system",
          user + " asked the moon —",
          esc(pick(FATES))
        );
      }

      /* ═══════════════════ ALERTS ═══════════════════
         Same voice as the fates — the moon narrating, not a receipt printer. */
      const COPY = {
        follow: [
          "{u} stepped into the moonlight.",
          "{u} is watching the sky with us now.",
          "The moon noticed {u}. So have we.",
          "{u} joined the vigil.",
          "One more shadow around the fire. Welcome, {u}.",
          "{u} followed the light all the way here.",
        ],
        follows: [
          "{n} new souls stepped into the moonlight.",
          "{n} more shadows around the fire. Welcome, all of you.",
          "The moon counted {n} arrivals. It approves.",
        ],
        sub: [
          "{u} swore an oath to the moon.",
          "The moon has a new devotee: {u}.",
          "{u} signed the pact. No takebacks.",
          "{u} chose the long night. Good choice.",
        ],
        resub: [
          "{u} has kept the vigil {n} months.",
          "{n} months and {u} still hasn't looked away.",
          "{u} renews the pact — {n} months deep.",
          "{n} months of loyalty from {u}. The moon remembers.",
        ],
        gift: [
          "{u} gifted {r} a sub. Generosity is its own magic.",
          "{u} handed {r} a place by the fire.",
          "{r} got pulled into the light by {u}.",
          "{u} paid {r}'s way into the vigil.",
        ],
        massgift: [
          "{u} loosed {n} subs on the sky.",
          "{n} subs from {u}. The whole chat owes them a drink.",
          "{u} went full moon and gifted {n}.",
          "{u} opened the vault — {n} subs, just like that.",
        ],
        raid: [
          "{u} broke through the clouds with {n}.",
          "{n} raiders behind {u}. Hold onto something.",
          "The sky splits — {u} arrives with {n}.",
          "{u} brought {n} souls with them. Make room.",
        ],
        cheer: [
          "{u} cheered {n} bits.",
          "{u} threw {n} bits at the moon.",
          "{n} bits from {u}. The moon accepts tribute.",
        ],
        bigcheer: [
          "{u} dropped {n} bits. The sky is listening.",
          "{n} bits from {u}. The moon actually flinched.",
          "{u} just lit the whole night up — {n} bits.",
        ],
      };

      const WHO = {
        follow: "A new follower —",
        follows: "The gates open —",
        sub: "An oath sworn —",
        resub: "The vigil continues —",
        gift: "A gift given —",
        massgift: "The sky opens —",
        raid: "A raid arrives —",
        cheer: "Bits in the dark —",
        bigcheer: "Tribute paid —",
      };

      // fill {u} {r} {n}, bolding the parts that matter
      function phrase(set, vals) {
        return pick(COPY[set]).replace(/\{(u|r|n)\}/g, (_, k) => b(vals[k]));
      }

      /* ── follows: merge any that are still waiting, so a raid-flood
            becomes one banner instead of twenty ── */
      function alertFollow(user) {
        Scene.note("follow", user);
        const waiting = Director.q.find((e) => e.type === "follow");
        if (waiting) {
          waiting.names.push(user);
          const n = waiting.names.length;
          waiting.who = WHO.follows;
          waiting.html = phrase("follows", { n });
          return;
        }
        const evt = Director.push("follow", WHO.follow, phrase("follow", { u: user }));
        evt.names = [user];
      }

      function alertSub(user, months) {
        Scene.note("sub", user);
        const m = parseInt(months) || 0;
        if (m > 1)
          Director.push("sub", WHO.resub, phrase("resub", { u: user, n: m }));
        else Director.push("sub", WHO.sub, phrase("sub", { u: user }));
      }

      /* Twitch sends submysterygift AND an individual subgift per recipient.
         Without this, a 20-sub bomb would fire 21 banners. */
      const giftBomb = new Map();

      function alertMassGift(user, count) {
        Scene.note("massgift", user);
        const n = parseInt(count) || 1;
        giftBomb.set(user, { left: n, until: Date.now() + 15000 });
        Director.push("massgift", WHO.massgift, phrase("massgift", { u: user, n }));
      }

      function alertGift(user, recipient) {
        const bomb = giftBomb.get(user);
        if (bomb && bomb.left > 0 && Date.now() < bomb.until) {
          bomb.left--; // part of a bomb we already announced
          return;
        }
        Scene.note("gift", user); // only the gifts that actually announce
        Director.push(
          "gift",
          WHO.gift,
          phrase("gift", { u: user, r: recipient || "someone" })
        );
      }

      function alertRaid(user, viewers) {
        Scene.note("raid", user);
        const n = parseInt(viewers) || 0;
        Director.push("raid", WHO.raid, phrase("raid", { u: user, n }));
      }

      /* ── cheers: same user cheering repeatedly within a few seconds
            collapses into one banner rather than a stutter of them ── */
      const cheerLog = new Map();

      function alertCheer(user, bits) {
        const n = parseInt(bits) || 0;
        if (!n) return;
        const now = Date.now();
        const recent = cheerLog.get(user);
        if (recent && now - recent.at < 6000) {
          recent.at = now;
          recent.total += n;
          const t = recent.total;
          const big = t >= CONFIG.bigCheer;
          if (recent.evt && Director.q.includes(recent.evt)) {
            recent.evt.who = big ? WHO.bigcheer : WHO.cheer;
            recent.evt.html = phrase(big ? "bigcheer" : "cheer", { u: user, n: t });
            return;
          }
        }
        const big = n >= CONFIG.bigCheer;
        const evt = Director.push(
          big ? "bigcheer" : "cheer",
          big ? WHO.bigcheer : WHO.cheer,
          phrase(big ? "bigcheer" : "cheer", { u: user, n })
        );
        cheerLog.set(user, { at: now, total: n, evt });
      }

      /* ═══════════════════ TALLIES ═══════════════════ */
      const KEYS = {
        map: "maps",
        maps: "maps",
        death: "deaths",
        deaths: "deaths",
        mirror: "mirrors",
        mirrors: "mirrors",
      };
      let tally = { maps: 0, deaths: 0, mirrors: 0 };
      try {
        Object.assign(
          tally,
          JSON.parse(localStorage.getItem("rawad-tally") || "{}")
        );
      } catch (e) {}

      function paint(key, bump) {
        const box = document.getElementById("s-" + key);
        box.querySelector(".v").textContent = tally[key];
        if (bump) {
          box.classList.remove("hit");
          void box.offsetWidth;
          box.classList.add("hit");
        }
        try {
          localStorage.setItem("rawad-tally", JSON.stringify(tally));
        } catch (e) {}
      }
      Object.keys(tally).forEach((k) => paint(k, false));

      /* ═══════════════════ POLL ═══════════════════ */
      const pollEl = document.getElementById("poll");
      let poll = null,
        pollTimer = null;

      function openPoll(text, a, b) {
        poll = {
          a: 0,
          b: 0,
          voters: new Set(),
          ends: Date.now() + CONFIG.pollSeconds * 1000,
        };
        document.getElementById("pText").textContent = text;
        document.getElementById("pA").textContent = "!1 " + a;
        document.getElementById("pB").textContent = b + " !2";
        pollEl.classList.add("on");
        oracle.classList.add("lowered"); // keep clear of a banner already showing
        clearInterval(pollTimer);
        pollTimer = setInterval(tickPoll, 250);
        tickPoll();
      }
      function tickPoll() {
        if (!poll) return;
        const left = Math.max(0, Math.ceil((poll.ends - Date.now()) / 1000));
        document.getElementById("pTime").textContent = left;
        const tot = poll.a + poll.b;
        const pa = tot ? (poll.a / tot) * 100 : 50;
        document.getElementById("pA").style.width = pa + "%";
        document.getElementById("pB").style.width = 100 - pa + "%";
        if (left === 0) closePoll();
      }
      function closePoll() {
        clearInterval(pollTimer);
        const tot = poll ? poll.a + poll.b : 0;
        const pa = tot ? Math.round((poll.a / tot) * 100) : 0;
        setTimeout(() => {
          pollEl.classList.remove("on");
          oracle.classList.remove("lowered");
        }, 4000);
        if (tot)
          say(
            "Chat has decided —",
            pa + "% to " + (pa >= 50 ? "option one" : "option two") + "."
          );
        poll = null;
      }

      /* ═══════════════════ CHAT ═══════════════════ */
      /* USERNOTICE — subs, gifts and raids. All of this arrives on the
         anonymous connection; only follows need a token (see EventSub below). */
      function notice(m) {
        ping(); // hype should move the moon too
        const t = m.tags;
        switch (m.id) {
          case "sub":
          case "resub":
            return alertSub(m.user, t["msg-param-cumulative-months"]);
          case "subgift":
          case "anonsubgift":
            return alertGift(
              m.user,
              t["msg-param-recipient-display-name"] ||
                t["msg-param-recipient-user-name"]
            );
          case "submysterygift":
            return alertMassGift(m.user, t["msg-param-mass-gift-count"]);
          case "raid":
            return alertRaid(
              t["msg-param-displayName"] || m.user,
              t["msg-param-viewerCount"]
            );
        }
      }

      function handle(m) {
        if (m.kind === "notice") return notice(m);
        ping();
        Scene.chat(m.login, m.user); // names only — never the message text
        if (m.bits) alertCheer(m.user, m.bits);
        const msg = m.msg;
        if (!msg.startsWith("!")) return;
        const [cmd, ...rest] = msg.slice(1).split(/\s+/);
        const arg = rest.join(" ");
        const c = cmd.toLowerCase();

        if (c === "fate") return fate(m.user);

        if (poll && (c === "1" || c === "2") && !poll.voters.has(m.login)) {
          poll.voters.add(m.login);
          poll[c === "1" ? "a" : "b"]++;
          return tickPoll();
        }

        if (!m.mod) return; // ── mod / broadcaster only ──
        if (KEYS[c]) {
          const k = KEYS[c];
          tally[k]++;
          return paint(k, true);
        }
        if (c === "undo" && KEYS[rest[0]]) {
          const k = KEYS[rest[0]];
          tally[k] = Math.max(0, tally[k] - 1);
          return paint(k, true);
        }
        if (c === "set" && KEYS[rest[0]]) {
          const k = KEYS[rest[0]];
          tally[k] = Math.max(0, parseInt(rest[1]) || 0);
          return paint(k, true);
        }
        if (c === "poll") {
          const parts = arg.split("|").map((s) => s.trim());
          return openPoll(
            parts[0] || "Yes or no?",
            parts[1] || "Yes",
            parts[2] || "No"
          );
        }
        if (c === "endpoll" && poll) return closePoll();
        if (c === "say" && arg) return say("Rawad says —", arg);
        if (c === "testalert") return testAlert(rest[0] || "sub", m.user);
        // away controls — the OBS toggle shows the scene, these set what it says
        if (c === "brb") return Scene.brb(rest[0]);
        if (c === "afk") return Scene.afk();
        if (c === "back") return Scene.back();
      }

      /* fire a fake alert without waiting on a real one — !testalert raid, etc.
         "burst" throws everything at once to prove the queue serialises it. */
      function testAlert(kind, who) {
        const u = who || "test_viewer";
        switch ((kind || "").toLowerCase()) {
          case "follow":
            return alertFollow(u);
          case "resub":
            return alertSub(u, 14);
          case "gift":
            return alertGift(u, "someone_lucky");
          case "massgift":
            return alertMassGift(u, 20);
          case "raid":
            return alertRaid(u, 137);
          case "cheer":
            return alertCheer(u, 250);
          case "bigcheer":
            return alertCheer(u, 5000);
          case "burst":
            alertFollow("first_soul");
            alertCheer("bit_thrower", 300);
            alertSub("oath_keeper", 8);
            alertRaid("sky_breaker", 212);
            alertFollow("second_soul");
            alertFollow("third_soul");
            alertMassGift("big_spender", 20);
            return;
          default:
            return alertSub(u, 1);
        }
      }

      function connect() {
        const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
        ws.onopen = () => {
          Status.irc = "live";
          // commands is what carries USERNOTICE (subs, gifts, raids)
          ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
          ws.send("NICK justinfan" + (((Math.random() * 90000) | 0) + 10000));
          ws.send("JOIN #" + CONFIG.channel.toLowerCase());
        };
        ws.onmessage = (e) => {
          for (const line of e.data.split("\r\n")) {
            if (!line) continue;
            if (line.startsWith("PING")) {
              ws.send("PONG :tmi.twitch.tv");
              continue;
            }
            const m = parse(line);
            if (m) handle(m);
          }
        };
        ws.onclose = () => {
          Status.irc = "down";
          setTimeout(connect, 4000);
        };
        ws.onerror = () => ws.close();
      }

      // IRCv3 escapes these inside tag values — display names need unescaping
      const untag = (v) =>
        String(v).replace(
          /\\(.)/g,
          (_, c) => ({ s: " ", ":": ";", r: "\r", n: "\n", "\\": "\\" })[c] || c
        );

      function parse(raw) {
        let tags = {},
          rest = raw;
        if (rest[0] === "@") {
          const sp = rest.indexOf(" ");
          rest
            .slice(1, sp)
            .split(";")
            .forEach((kv) => {
              const i = kv.indexOf("=");
              tags[kv.slice(0, i)] = untag(kv.slice(i + 1));
            });
          rest = rest.slice(sp + 1);
        }

        // USERNOTICE comes from tmi.twitch.tv and often carries no trailing body
        if (/^:tmi\.twitch\.tv USERNOTICE #/.test(rest)) {
          return {
            kind: "notice",
            id: tags["msg-id"] || "",
            user: tags["display-name"] || tags.login || "someone",
            tags,
          };
        }

        const m = rest.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :([\s\S]*)$/);
        if (!m) return null;
        const badges = tags.badges || "";
        return {
          kind: "chat",
          bits: parseInt(tags.bits) || 0,
          login: m[1],
          user: tags["display-name"] || m[1],
          msg: m[2].replace(/[\u0001\r\n]/g, "").trim(),
          mod: tags.mod === "1" || /broadcaster|moderator/.test(badges),
        };
      }

      /* ═══════════════════ FOLLOWS (EventSub) ═══════════════════
         Follows are the one event Twitch won't send over IRC, so they need a
         token. Without one this whole block no-ops and every other alert still
         works — an expired token must never make the overlay look broken. */
      const noticeEl = document.getElementById("notice");
      function showNotice(text) {
        noticeEl.textContent = text;
        noticeEl.classList.add("on");
      }
      function clearNotice() {
        noticeEl.classList.remove("on");
      }

      function helix(path, opts) {
        return fetch(
          "https://api.twitch.tv/helix/" + path,
          Object.assign(
            {
              headers: {
                "Client-Id": CLIENT_ID,
                Authorization: "Bearer " + TOKEN,
                "Content-Type": "application/json",
              },
            },
            opts
          )
        );
      }

      let esSocket = null,
        userId = null,
        esRetry = null;

      async function followsInit() {
        if (!TOKEN || !CLIENT_ID) return; // no token configured — stay quiet
        try {
          const r = await helix(
            "users?login=" + encodeURIComponent(CONFIG.channel)
          );
          if (r.status === 401) return showNotice("twitch token expired");
          const j = await r.json();
          userId = j.data && j.data[0] && j.data[0].id;
          if (!userId) return showNotice("channel not found");
          esConnect("wss://eventsub.wss.twitch.tv/ws");
        } catch (e) {
          showNotice("follow alerts offline");
        }
      }

      function esConnect(url) {
        const ws = new WebSocket(url);
        ws.onmessage = (e) => {
          let d;
          try {
            d = JSON.parse(e.data);
          } catch (_) {
            return;
          }
          const type = d.metadata && d.metadata.message_type;

          if (type === "session_welcome") {
            // on a reconnect handoff, only drop the old socket once this one is welcomed
            if (esSocket && esSocket !== ws) {
              try {
                esSocket.close();
              } catch (_) {}
            }
            esSocket = ws;
            esSubscribe(d.payload.session.id); // must happen within 10s
          } else if (type === "notification") {
            if (d.payload.subscription.type === "channel.follow") {
              const ev = d.payload.event || {};
              alertFollow(ev.user_name || ev.user_login || "someone");
            }
          } else if (type === "session_reconnect") {
            esConnect(d.payload.session.reconnect_url);
          } else if (type === "revocation") {
            showNotice("follow alerts revoked");
          }
        };
        ws.onclose = () => {
          if (esSocket !== ws) return; // superseded by a reconnect, nothing to do
          esSocket = null;
          clearTimeout(esRetry);
          esRetry = setTimeout(followsInit, 5000);
        };
        ws.onerror = () => {
          try {
            ws.close();
          } catch (_) {}
        };
      }

      async function esSubscribe(sessionId) {
        try {
          const r = await helix("eventsub/subscriptions", {
            method: "POST",
            body: JSON.stringify({
              type: "channel.follow",
              version: "2",
              condition: {
                broadcaster_user_id: userId,
                moderator_user_id: userId,
              },
              transport: { method: "websocket", session_id: sessionId },
            }),
          });
          if (r.ok) {
            Status.eventsub = "live";
            return clearNotice();
          }
          Status.eventsub = r.status === 401 ? "expired" : "error";
          showNotice(
            r.status === 401 ? "twitch token expired" : "follow alerts unavailable"
          );
        } catch (e) {
          Status.eventsub = "error";
          showNotice("follow alerts offline");
        }
      }

      /* ═══════════════════ AFK / BRB SCENE ═══════════════════
         Runs in a second OBS browser source (?mode=afk / ?mode=brb) layered
         under the HUD. Everything is drawn on one canvas; the loop pauses when
         OBS reports the source hidden, because hidden sources keep running. */
      const AWAY_PROMPTS = [
        "Type <b>!fate</b> — the moon still answers",
        "Every chatter becomes a <b>star</b> up there",
        "Keep talking and the <b>moon rises</b>",
        "Follow to put your name in the <b>sky</b>",
        "<b>!fate</b> works even while I'm gone",
        "The constellation is built from <b>whoever's talking</b>",
      ];

      const Scene = {
        on: SCENE,
        state: MODE === "afk" ? "afk" : MODE === "brb" ? "brb" : "idle",
        until: 0,
        since: Date.now(),
        follows: 0,
        subs: 0,
        messages: 0,
        stars: new Map(),
        recent: [],
        shots: [],
        dust: [],
        raf: null,
        paused: false,
        moonFull: false,

        /* ── geometry: the HUD owns these, so nothing of ours may land in them ── */
        blocked: [
          [520, 16, 1040, 92], // top strip + quiet hint
          [26, 132, 82, 812], // left rail
          [26, 96, 200, 112], // token notice
          [470, 620, 1030, 822], // poll + alert banner
          [150, 240, 1010, 560], // our own status block
          [150, 860, 650, 1030], // our own goal bars
          [1140, 880, 1810, 1010], // our own prompt
        ],
        moonX: 1360,
        moonY: 400,
        moonR: 200,

        free(x, y) {
          // keep clear of the moon (and its glow) as well as every text block
          const dx = x - this.moonX,
            dy = y - this.moonY;
          if (dx * dx + dy * dy < 250 * 250) return false;
          if (x < 60 || x > 1880 || y < 50 || y > 1040) return false;
          return !this.blocked.some(
            (r) => x > r[0] - 40 && x < r[2] + 40 && y > r[1] - 30 && y < r[3] + 30
          );
        },

        // stable per-name placement, so someone's star is always in the same spot
        place(login) {
          let h = 2166136261;
          for (let i = 0; i < login.length; i++) {
            h ^= login.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          for (let a = 0; a < 40; a++) {
            const s1 = Math.imul(h ^ (a * 0x9e3779b9), 2654435761) >>> 0;
            const s2 = Math.imul(s1 ^ 0x85ebca6b, 2246822519) >>> 0;
            const x = 60 + (s1 % 1820);
            const y = 50 + (s2 % 990);
            if (this.free(x, y)) return { x, y };
          }
          return null; // sky's full in the usable region — skip this one
        },

        chat(login, name) {
          if (!this.on) return;
          this.messages++;
          const now = Date.now();
          let st = this.stars.get(login);
          if (!st) {
            const pos = this.place(login);
            if (!pos) return;
            st = { x: pos.x, y: pos.y, name, born: now, bright: 0 };
            this.stars.set(login, st);
            if (this.stars.size > CONFIG.maxStars) {
              // evict whoever has been quiet longest
              let oldest = null,
                oldestAt = Infinity;
              this.stars.forEach((v, k) => {
                if (v.last < oldestAt) {
                  oldestAt = v.last;
                  oldest = k;
                }
              });
              if (oldest) this.stars.delete(oldest);
            }
          }
          st.name = name;
          st.last = now;
          st.bright = 1;
          this.recent = [login, ...this.recent.filter((l) => l !== login)].slice(
            0,
            CONFIG.constellation
          );
        },

        /* called from the alert functions so a real follow/sub crosses the sky */
        note(type, name) {
          if (!this.on) return;
          if (type === "follow") this.follows++;
          else if (type === "sub" || type === "gift") this.subs++;
          else if (type === "massgift") this.subs += 5;
          const ember = type !== "follow";
          this.shots.push({
            x: -160,
            y: 120 + Math.random() * 520,
            vx: 5.4 + Math.random() * 1.6,
            vy: 0.9 + Math.random() * 0.7,
            life: 0,
            max: 460,
            name: String(name || "someone"),
            ember,
          });
          if (this.shots.length > 6) this.shots.shift();
          this.paintGoals();
        },

        /* ── state ── */
        brb(minutes) {
          const m = Math.max(1, Math.min(180, parseInt(minutes) || CONFIG.brbMinutes));
          this.state = "brb";
          this.since = Date.now();
          this.until = Date.now() + m * 60000;
          this.reset();
          this.share();
        },
        afk() {
          this.state = "afk";
          this.since = Date.now();
          this.until = 0;
          this.reset();
          this.share();
        },
        back() {
          this.state = "back";
          this.until = 0;
          this.share();
        },
        reset() {
          this.follows = this.subs = this.messages = 0;
          this.moonFull = false;
          this.paintGoals();
        },
        share() {
          try {
            if (this.bc)
              this.bc.postMessage({
                state: this.state,
                until: this.until,
                since: this.since,
              });
          } catch (e) {}
        },

        /* ── goals ── */
        goalDefs() {
          return [
            ["New souls", this.follows, CONFIG.goalFollows],
            ["Oaths sworn", this.subs, CONFIG.goalSubs],
            ["Messages", this.messages, CONFIG.goalMessages],
          ];
        },
        paintGoals() {
          if (!this.on || !this.goalsEl) return;
          this.goalDefs().forEach(([label, val, target], i) => {
            const row = this.goalsEl.children[i];
            if (!row) return;
            const pct = Math.min(100, (val / target) * 100);
            row.querySelector("b").textContent = val + " / " + target;
            row.querySelector("i").style.width = pct + "%";
            row.classList.toggle("done", val >= target);
          });
        },

        /* ── the loop ── */
        setVisible(v) {
          if (!this.on) return;
          if (v) {
            // the OBS toggle *is* the reset — showing the source always starts
            // a fresh timer, so hide/show is a one-click reset from OBS alone
            if (MODE === "brb") this.brb(qs.get("min"));
            else if (MODE === "afk") this.afk();
            this.paused = false;
            this.start();
          } else {
            this.paused = true; // hidden OBS sources keep running otherwise
          }
        },
        start() {
          if (!this.raf) this.raf = requestAnimationFrame(() => this.frame());
        },
        frame() {
          this.raf = null;
          if (this.paused) return;
          this.draw();
          this.raf = requestAnimationFrame(() => this.frame());
        },

        init() {
          if (!this.on) return;
          this.cv = document.getElementById("sky");
          this.ctx = this.cv.getContext("2d");
          this.goalsEl = document.getElementById("scGoals");
          this.titleEl = document.getElementById("scTitle");
          this.timerEl = document.getElementById("scTimer");
          this.kickerEl = document.getElementById("scKicker");
          this.subEl = document.getElementById("scSub");
          this.promptEl = document.getElementById("scPromptText");

          this.goalsEl.innerHTML = this.goalDefs()
            .map(
              ([label]) =>
                '<div class="goal"><div class="row"><span>' +
                esc(label) +
                "</span><b>0 / 0</b></div><div class=\"bar\"><i></i></div></div>"
            )
            .join("");
          this.paintGoals();

          // ambient drifting dust, separate from the named chatter stars
          for (let i = 0; i < 130; i++)
            this.dust.push({
              x: Math.random() * 1920,
              y: Math.random() * 1080,
              r: Math.random() * 1.5 + 0.35,
              a: Math.random() * 0.5 + 0.12,
              tw: Math.random() * 6.28,
              sp: Math.random() * 0.02 + 0.004,
            });

          if (MODE === "brb") this.brb(qs.get("min"));
          else if (MODE === "afk") this.afk();

          let pi = 0;
          this.promptEl.innerHTML = AWAY_PROMPTS[0];
          setInterval(() => {
            this.promptEl.classList.add("out");
            setTimeout(() => {
              pi = (pi + 1) % AWAY_PROMPTS.length;
              this.promptEl.innerHTML = AWAY_PROMPTS[pi];
              this.promptEl.classList.remove("out");
            }, 500);
          }, 9000);

          try {
            this.bc = new BroadcastChannel("rawad-away");
            this.bc.onmessage = (e) => {
              const d = e.data || {};
              if (!d.state || d.since <= this.since) return;
              this.state = d.state;
              this.until = d.until;
              this.since = d.since;
              this.reset();
            };
          } catch (e) {}

          // OBS visibility — detail shape isn't documented, so read it defensively
          addEventListener("obsSourceVisibleChanged", (e) => {
            const v = e && e.detail ? e.detail.visible !== false : true;
            this.setVisible(v);
          });
          if (window.obsstudio)
            window.obsstudio.onVisibilityChange = (v) => this.setVisible(!!v);

          this.tick(Date.now()); // correct headline before the first frame lands
          this.start();
        },
      };

      /* ── drawing ── */
      Scene.draw = function () {
        const g = this.ctx,
          now = Date.now(),
          t = now / 1000;
        g.clearRect(0, 0, 1920, 1080);

        // backdrop
        const bg = g.createRadialGradient(1360, 360, 80, 960, 540, 1400);
        bg.addColorStop(0, "#1a1030");
        bg.addColorStop(0.55, "#0b0718");
        bg.addColorStop(1, "#06040d");
        g.fillStyle = bg;
        g.fillRect(0, 0, 1920, 1080);

        // ambient dust
        this.dust.forEach((d) => {
          d.tw += d.sp;
          const a = d.a * (0.55 + 0.45 * Math.sin(d.tw));
          g.globalAlpha = a;
          g.fillStyle = "#cdbbeb";
          g.beginPath();
          g.arc(d.x, d.y, d.r, 0, 6.283);
          g.fill();
        });
        g.globalAlpha = 1;

        // lines first so the moon occludes them — otherwise the constellation
        // draws straight across the moon's face and looks like scratches
        this.drawLines(g);
        this.drawMoonBig(g, now, t);
        this.drawStars(g, now, t);
        this.drawShots(g);
        this.tick(now);
      };

      Scene.drawMoonBig = function (g, now, t) {
        const cx = this.moonX,
          cy = this.moonY,
          r = this.moonR;
        const live = beats.filter((b) => now - b < 60000).length;
        const p = Math.min(1, live / CONFIG.fullMoonMessages);

        if (p >= 1 && !this.moonFull) this.moonFull = true;

        // glow
        const glow = g.createRadialGradient(cx, cy, r * 0.7, cx, cy, r * 2.05);
        glow.addColorStop(0, this.moonFull ? "rgba(232,163,61,.34)" : "rgba(122,47,242,.30)");
        glow.addColorStop(1, "rgba(122,47,242,0)");
        g.fillStyle = glow;
        g.beginPath();
        g.arc(cx, cy, r * 2.05, 0, 6.283);
        g.fill();

        // disc, then the shadow slid off to the right as energy rises
        g.save();
        g.beginPath();
        g.arc(cx, cy, r, 0, 6.283);
        g.clip();
        const lit = g.createRadialGradient(
          cx - r * 0.2,
          cy - r * 0.28,
          r * 0.1,
          cx,
          cy,
          r * 1.1
        );
        lit.addColorStop(0, "#FFFBF2");
        lit.addColorStop(1, this.moonFull ? "#F0D8A8" : "#CDBBEB");
        g.fillStyle = lit;
        g.fillRect(cx - r, cy - r, r * 2, r * 2);
        // shadow tinted to the sky behind it — pure black reads as an object
        // stuck on the moon rather than the unlit side of it
        g.fillStyle = "#150d29";
        g.beginPath();
        g.arc(cx + p * 2.1 * r, cy, r, 0, 6.283);
        g.fill();
        g.restore();

        g.strokeStyle = "rgba(169,123,255,.35)";
        g.lineWidth = 1.5;
        g.beginPath();
        g.arc(cx, cy, r, 0, 6.283);
        g.stroke();

        // chat-energy ring
        this.ring(g, cx, cy, r + 30, p, this.moonFull ? "#E8A33D" : "#A97BFF", 4);

        // countdown ring, brb only
        if (this.state === "brb" && this.until) {
          const total = this.until - this.since;
          const left = Math.max(0, this.until - now);
          this.ring(g, cx, cy, r + 52, total ? left / total : 0, "#E8A33D", 3);
        }

        g.font = "600 15px Rajdhani, sans-serif";
        g.fillStyle = "rgba(243,238,228,.5)";
        g.textAlign = "center";
        g.fillText(
          this.moonFull ? "THE MOON IS FULL" : "CHAT ENERGY  " + Math.round(p * 100) + "%",
          cx,
          cy + r + 92
        );
        g.textAlign = "left";
      };

      Scene.ring = function (g, cx, cy, rad, frac, color, w) {
        g.strokeStyle = "rgba(243,238,228,.09)";
        g.lineWidth = w;
        g.beginPath();
        g.arc(cx, cy, rad, 0, 6.283);
        g.stroke();
        if (frac <= 0) return;
        g.strokeStyle = color;
        g.lineWidth = w;
        g.lineCap = "round";
        g.beginPath();
        g.arc(cx, cy, rad, -1.5708, -1.5708 + 6.283 * Math.min(1, frac));
        g.stroke();
        g.lineCap = "butt";
      };

      /* constellation lines between the most recent voices */
      Scene.drawLines = function (g) {
        const pts = this.recent.map((l) => this.stars.get(l)).filter(Boolean);
        if (pts.length < 2) return;
        g.strokeStyle = "rgba(169,123,255,.20)";
        g.lineWidth = 1;
        g.beginPath();
        pts.forEach((s, i) => (i ? g.lineTo(s.x, s.y) : g.moveTo(s.x, s.y)));
        g.stroke();
      };

      Scene.drawStars = function (g, now, t) {
        const labelled = [...this.stars.entries()]
          .sort((a, b) => b[1].bright - a[1].bright)
          .slice(0, CONFIG.starLabels)
          .map(([l]) => l);

        this.stars.forEach((s, login) => {
          const age = (now - s.last) / 1000;
          s.bright = Math.max(0.28, 1 - age / 26);
          const tw = 0.82 + 0.18 * Math.sin(t * 2.1 + s.x * 0.01);
          const rad = 1.7 + s.bright * 3.1;

          const halo = g.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad * 5);
          halo.addColorStop(0, "rgba(233,224,255," + 0.5 * s.bright * tw + ")");
          halo.addColorStop(1, "rgba(122,47,242,0)");
          g.fillStyle = halo;
          g.beginPath();
          g.arc(s.x, s.y, rad * 5, 0, 6.283);
          g.fill();

          g.fillStyle = "rgba(255,251,242," + (0.55 + 0.45 * s.bright) * tw + ")";
          g.beginPath();
          g.arc(s.x, s.y, rad, 0, 6.283);
          g.fill();

          if (labelled.includes(login)) {
            g.font = "600 15px Rajdhani, sans-serif";
            g.fillStyle = "rgba(243,238,228," + (0.3 + 0.55 * s.bright) + ")";
            g.fillText(s.name, s.x + rad + 9, s.y + 5);
          }
        });
      };

      Scene.drawShots = function (g) {
        this.shots = this.shots.filter((s) => s.life < s.max);
        this.shots.forEach((s) => {
          s.life++;
          s.x += s.vx * 2.4;
          s.y += s.vy * 2.4;
          const fade =
            s.life < 40 ? s.life / 40 : Math.max(0, 1 - (s.life - 40) / (s.max - 40));
          const col = s.ember ? "232,163,61" : "169,123,255";
          const tail = g.createLinearGradient(s.x - s.vx * 46, s.y - s.vy * 46, s.x, s.y);
          tail.addColorStop(0, "rgba(" + col + ",0)");
          tail.addColorStop(1, "rgba(" + col + "," + 0.85 * fade + ")");
          g.strokeStyle = tail;
          g.lineWidth = 2.4;
          g.lineCap = "round";
          g.beginPath();
          g.moveTo(s.x - s.vx * 46, s.y - s.vy * 46);
          g.lineTo(s.x, s.y);
          g.stroke();
          g.lineCap = "butt";

          g.fillStyle = "rgba(255,251,242," + fade + ")";
          g.beginPath();
          g.arc(s.x, s.y, 3.1, 0, 6.283);
          g.fill();

          g.font = "700 19px Rajdhani, sans-serif";
          g.fillStyle = "rgba(" + col + "," + fade + ")";
          g.fillText(s.name, s.x + 14, s.y + 6);
        });
      };

      /* clock + headline. Runs every frame, so only touch the DOM when the text
         actually changes — otherwise it's 240 writes a second for an hour. */
      Scene.set = function (el, prop, val) {
        const k = el.id + prop;
        if (this._last[k] === val) return;
        this._last[k] = val;
        el[prop] = val;
      };
      Scene._last = {};

      Scene.tick = function (now) {
        const S = (el, v) => this.set(el, "textContent", v);
        if (this.state === "back") {
          S(this.kickerEl, "The vigil ends");
          S(this.titleEl, "Back now");
          S(this.timerEl, "");
          this.set(this.timerEl, "className", "num");
          S(this.subEl, "Thanks for keeping the sky lit");
          return;
        }

        const fmt = (ms) => {
          const s = Math.max(0, Math.floor(ms / 1000));
          const h = Math.floor(s / 3600);
          const m = Math.floor((s % 3600) / 60);
          const ss = s % 60;
          const pad = (n) => String(n).padStart(2, "0");
          return h ? h + ":" + pad(m) + ":" + pad(ss) : pad(m) + ":" + pad(ss);
        };

        if (this.state === "brb") {
          const left = this.until - now;
          S(this.kickerEl, "The moon keeps watch");
          S(this.titleEl, "Be right back");
          if (left > 0) {
            S(this.timerEl, fmt(left));
            this.set(this.timerEl, "className", "num");
            S(this.subEl, "Chat raises the moon while I'm gone");
          } else {
            // never sit on 00:00 — overrunning should still look deliberate
            S(this.timerEl, "any moment now…");
            this.set(this.timerEl, "className", "over");
            S(this.subEl, "Keep the sky busy a little longer");
          }
        } else if (this.state === "afk") {
          S(this.kickerEl, "Away — the moon keeps watch");
          S(this.titleEl, "AFK");
          S(this.timerEl, fmt(now - this.since));
          this.set(this.timerEl, "className", "num");
          S(this.subEl, "Back when the sky says so");
        }
      };

      Scene.init();

      /* ═══════════════════ CONTROL BUS WIRING ═══════════════════ */
      Bus.init();

      /* ── settings: panel-controlled and persisted, so they survive a source
            reload. URL params only seed the default when nothing is saved. ── */
      function currentSettings() {
        return {
          volume: CONFIG.volume,
          muted: Sound.muted,
          goalFollows: CONFIG.goalFollows,
          goalSubs: CONFIG.goalSubs,
          goalMessages: CONFIG.goalMessages,
          brbMinutes: CONFIG.brbMinutes,
          fullMoonMessages: CONFIG.fullMoonMessages,
          bigCheer: CONFIG.bigCheer,
        };
      }

      function applySettings(s, persist) {
        if (!s) return;
        if (typeof s.volume === "number") {
          CONFIG.volume = Math.max(0, Math.min(1, s.volume));
          Sound.vol = CONFIG.volume;
        }
        if (typeof s.muted === "boolean") Sound.muted = s.muted;
        [
          "goalFollows",
          "goalSubs",
          "goalMessages",
          "brbMinutes",
          "fullMoonMessages",
          "bigCheer",
        ].forEach((k) => {
          if (typeof s[k] === "number" && s[k] > 0) CONFIG[k] = s[k];
        });
        Scene.paintGoals();
        if (persist) {
          try {
            localStorage.setItem(
              "rawad-settings",
              JSON.stringify(currentSettings())
            );
          } catch (e) {}
        }
      }

      // saved settings win over URL params — the panel is the control surface
      try {
        const saved = JSON.parse(localStorage.getItem("rawad-settings") || "null");
        if (saved) applySettings(saved, false);
      } catch (e) {}

      function busHello() {
        Bus.send("hello", {
          role: SCENE ? "scene" : "hud",
          mode: MODE || "hud",
          demo: DEMO,
          build: BUILD,
          irc: Status.irc,
          eventsub: Status.eventsub,
          token: Status.token,
          away: {
            state: Scene.state,
            until: Scene.until,
            since: Scene.since,
            follows: Scene.follows,
            subs: Scene.subs,
            messages: Scene.messages,
          },
          tally: tally,
          poll: poll
            ? {
                open: true,
                a: poll.a,
                b: poll.b,
                left: Math.max(0, Math.ceil((poll.ends - Date.now()) / 1000)),
              }
            : { open: false },
          settings: currentSettings(),
        });
      }

      /* ── panel commands ──
         Every source receives these, which is deliberate: a real Twitch event
         reaches both too, so the HUD banner and the scene's shooting star stay
         in step. Handlers that don't apply to a mode no-op harmlessly. */
      Bus.on("away.brb", (p) => Scene.brb(p.minutes));
      Bus.on("away.afk", () => Scene.afk());
      Bus.on("away.back", () => Scene.back());
      Bus.on("away.reset", () => {
        if (Scene.state === "afk") Scene.afk();
        else Scene.brb(Math.round((Scene.until - Scene.since) / 60000));
      });

      Bus.on("tally.bump", (p) => {
        const k = p.key;
        if (!(k in tally)) return;
        tally[k] = Math.max(0, tally[k] + (parseInt(p.delta) || 0));
        paint(k, true);
      });
      Bus.on("tally.set", (p) => {
        const k = p.key;
        if (!(k in tally)) return;
        tally[k] = Math.max(0, parseInt(p.value) || 0);
        paint(k, true);
      });

      Bus.on("poll.open", (p) =>
        openPoll(p.text || "Yes or no?", p.a || "Yes", p.b || "No")
      );
      Bus.on("poll.close", () => {
        if (poll) closePoll();
      });

      Bus.on("alert.test", (p) => testAlert(p.kind || "sub", p.user || "test_viewer"));
      Bus.on("oracle.say", (p) => {
        if (p.line) say(p.who || "Rawad says —", p.line);
      });
      Bus.on("oracle.fate", (p) => {
        fateLog.delete(p.user || "panel"); // panel shouldn't be rate-limited
        fate(p.user || "the panel");
      });

      Bus.on("settings", (p) => applySettings(p, true));
      // answer a panel that just opened, rather than making it wait for the tick
      Bus.on("ping", busHello);
      setInterval(busHello, 2000);
      busHello();

      /* A plain localStorage marker, independent of the message bus. If the
         admin dock can read this, OBS shares storage between docks and sources
         and any failure is in the messaging; if it can't, storage is isolated
         and the bus can never work. That distinction is what the panel's
         diagnostics section reports. */
      function busPresence() {
        try {
          localStorage.setItem(
            "rawad-presence",
            JSON.stringify({
              role: SCENE ? "scene" : "hud",
              mode: MODE || "hud",
              build: BUILD,
              ts: Date.now(),
            })
          );
        } catch (e) {}
      }
      setInterval(busPresence, 2000);
      busPresence();

      /* ═══════════════════ DEMO ═══════════════════ */
      if (DEMO) {
        const names = [
          "exilewick",
          "moonlitgg",
          "vaal_andy",
          "chris_wilson_fan",
          "kalandra",
          "zdps_enjoyer",
        ];
        // a wider cast so the constellation actually fills out in a preview
        const crowd = names.concat([
          "sirestus",
          "hexweaver",
          "delve_diver",
          "poe_gremlin",
          "tabula_rasa",
          "lootgoblin",
          "shaper_fan",
          "atlas_andy",
          "harvestenjoyer",
          "quantumleap",
          "nightowl",
          "brekstone",
        ]);
        setInterval(() => {
          if (Math.random() < 0.7) ping();
          if (SCENE && Math.random() < 0.8) {
            const n = pick(crowd);
            Scene.chat(n, n);
          }
        }, 900);
        setTimeout(() => fate(pick(names)), 2500);
        setInterval(() => fate(pick(names)), 16000);

        // the burst is the real test: everything at once, on purpose
        setTimeout(() => testAlert("burst"), 4000);
        setTimeout(() => alertCheer(pick(names), 5000), 30000);
        setInterval(() => alertFollow(pick(names)), 21000);
        setInterval(() => alertSub(pick(names), 1 + ((Math.random() * 30) | 0)), 27000);
        setInterval(() => alertGift(pick(names), pick(names)), 41000);
        setTimeout(() => {
          openPoll("Does he clear this without dying?", "Clean", "Portal gone");
          const v = setInterval(() => {
            if (!poll) return clearInterval(v);
            poll[Math.random() < 0.62 ? "a" : "b"]++;
            tickPoll();
          }, 600);
        }, 8000);
        setTimeout(() => {
          tally.maps = 14;
          tally.deaths = 3;
          tally.mirrors = 1;
          Object.keys(tally).forEach((k) => paint(k, true));
        }, 1400);
        Status.irc = "demo"; // never connects in demo — don't report "connecting" forever
      } else {
        connect();
        followsInit();
      }

      // a normal browser tab keeps audio suspended until a gesture; OBS doesn't care
      addEventListener("click", () => Sound.ready(), { once: true });
    </script>
  </body>
</html>
