<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RAWAD — Stream Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ═══════════════════════════════════════════════════════════════
   RAWAD OVERLAY — design tokens
   violet    #7A2FF2   the brush swoosh under the wordmark
   deep      #3D0F8A   shadow side of the swoosh
   rune      #A97BFF   the thin tick marks / "GAME ON" rail text
   cream     #F3EEE4   the brush wordmark
   ember     #E8A33D   the castle sunset — reserved for gains only
   ═══════════════════════════════════════════════════════════════ */
      :root {
        --violet: #7a2ff2;
        --deep: #3d0f8a;
        --rune: #a97bff;
        --cream: #f3eee4;
        --ember: #e8a33d;
        --ink: #0a0612;
        --dim: rgba(243, 238, 228, 0.42);
        --glow: 0 0 18px rgba(122, 47, 242, 0.55);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Rajdhani", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body.bg {
        background: radial-gradient(
            120% 90% at 30% 20%,
            #241634 0%,
            #0a0612 60%
          ),
          #0a0612;
      }

      #stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
      }

      .num {
        font-family: "Barlow Condensed", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .cap {
        text-transform: uppercase;
        letter-spacing: 0.34em;
        font-weight: 600;
      }

      /* ───────────────────────── LEFT RAIL ───────────────────────── */
      #rail {
        position: absolute;
        left: 26px;
        top: 132px;
        width: 56px;
        height: 680px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        opacity: 0;
        animation: railIn 1.1s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes railIn {
        to {
          opacity: 1;
        }
      }
      #rail .hair {
        width: 1px;
        flex: 1;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(169, 123, 255, 0.55) 18%,
          rgba(169, 123, 255, 0.55) 82%,
          transparent
        );
      }
      #rail .ticks {
        position: absolute;
        left: 27px;
        top: 0;
        height: 100%;
        width: 14px;
      }
      #rail .ticks i {
        position: absolute;
        left: 0;
        width: 9px;
        height: 1px;
        background: var(--rune);
        opacity: 0.7;
      }
      .glyph {
        width: 24px;
        height: 24px;
        fill: var(--violet);
        filter: drop-shadow(var(--glow));
      }
      #railName {
        writing-mode: vertical-rl;
        font-size: 15px;
        color: var(--cream);
        letter-spacing: 0.46em;
        text-transform: uppercase;
        font-weight: 600;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      }
      #clock {
        writing-mode: vertical-rl;
        font-size: 19px;
        color: var(--rune);
        letter-spacing: 0.22em;
        opacity: 0.85;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      }
      #crosshair {
        width: 34px;
        height: 34px;
      }
      #crosshair circle,
      #crosshair line {
        stroke: var(--rune);
        fill: none;
        stroke-width: 1;
      }
      #crosshair .core {
        fill: var(--violet);
        stroke: none;
      }

      /* ───────────────────── TOP STRIP (safe lane) ───────────────────── */
      /* Sits between PoE's buff icons (ends ~x502) and the map info text (~x1050) */
      #strip {
        position: absolute;
        left: 520px;
        top: 16px;
        width: 520px;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 20px;
        opacity: 0;
        transform: translateY(-12px);
        animation: stripIn 0.9s 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes stripIn {
        to {
          opacity: 1;
          transform: none;
        }
      }

      #moonWrap {
        position: relative;
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
      }
      #moonRing {
        position: absolute;
        inset: -6px;
        opacity: 0;
        transform: scale(0.85);
      }
      #moonRing path {
        fill: none;
        stroke: var(--violet);
        stroke-width: 3;
        stroke-linecap: round;
      }
      #moonWrap.full #moonRing {
        animation: flare 1.6s ease-out;
      }
      @keyframes flare {
        0% {
          opacity: 0;
          transform: scale(0.85) rotate(-8deg);
        }
        30% {
          opacity: 1;
          transform: scale(1.06) rotate(2deg);
        }
        100% {
          opacity: 0;
          transform: scale(1.3) rotate(10deg);
        }
      }
      #moonWrap.full #moonSvg {
        filter: drop-shadow(0 0 14px rgba(232, 163, 61, 0.85));
      }

      .meters {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 0;
      }
      #chatLabel {
        font-size: 11.5px;
        color: var(--dim);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-weight: 600;
        white-space: nowrap;
        text-shadow: 0 1px 6px #000;
      }
      #chatLabel b {
        color: var(--cream);
        font-weight: 700;
      }
      #track {
        height: 3px;
        background: rgba(243, 238, 228, 0.14);
        border-radius: 2px;
        overflow: hidden;
      }
      #fill {
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          var(--deep),
          var(--violet) 70%,
          var(--rune)
        );
        box-shadow: 0 0 10px rgba(122, 47, 242, 0.8);
        transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #quietHint {
        position: absolute;
        left: 0;
        top: 60px;
        width: 100%;
        font-size: 11.5px;
        letter-spacing: 0.12em;
        white-space: nowrap;
        color: var(--rune);
        text-shadow: 0 1px 6px #000;
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }
      #quietHint.show {
        opacity: 1;
        transform: none;
      }
      #quietHint b {
        color: var(--cream);
        font-weight: 700;
      }

      #tally {
        display: flex;
        gap: 16px;
        flex: 0 0 auto;
      }
      .stat {
        text-align: center;
        min-width: 34px;
      }
      .stat .v {
        display: block;
        font-size: 25px;
        line-height: 0.9;
        color: var(--cream);
        font-weight: 700;
        text-shadow: 0 2px 8px #000;
      }
      .stat .k {
        display: block;
        font-size: 9px;
        color: var(--dim);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 600;
        margin-top: 3px;
      }
      .stat.hit .v {
        animation: pop 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes pop {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(1.5);
          color: var(--ember);
        }
        100% {
          transform: scale(1);
        }
      }

      /* ─────────────────── ORACLE BANNER (bottom centre) ─────────────────── */
      #oracle {
        position: absolute;
        left: 470px;
        top: 690px;
        width: 560px;
        transform-origin: top center;
        pointer-events: none;
        opacity: 0;
        transform: scaleY(0);
      }
      #oracle.on {
        animation: unfurl 9.4s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }
      /* a live poll is only 13px above the banner — drop it a touch so the two
         read as separate things. Still clears the flask bar at y880. */
      #oracle.lowered {
        top: 716px;
      }
      @keyframes unfurl {
        0% {
          opacity: 0;
          transform: scaleY(0);
        }
        8% {
          opacity: 1;
          transform: scaleY(1);
        }
        88% {
          opacity: 1;
          transform: scaleY(1);
        }
        100% {
          opacity: 0;
          transform: scaleY(0);
        }
      }
      #oracle .rod {
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--rune) 12%,
          var(--cream) 50%,
          var(--rune) 88%,
          transparent
        );
      }
      #oracle .cloth {
        position: relative;
        padding: 16px 26px 30px;
        background: linear-gradient(
          180deg,
          rgba(61, 15, 138, 0.94),
          rgba(20, 6, 48, 0.9)
        );
        clip-path: polygon(
          0 0,
          100% 0,
          100% calc(100% - 16px),
          50% 100%,
          0 calc(100% - 16px)
        );
        border-left: 1px solid rgba(169, 123, 255, 0.35);
        border-right: 1px solid rgba(169, 123, 255, 0.35);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75);
      }
      #oWho {
        font-size: 11px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--rune);
        font-weight: 700;
        margin-bottom: 8px;
      }
      #oLine {
        font-size: 23px;
        color: var(--cream);
        line-height: 1.34;
        font-weight: 500;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      #oLine b {
        color: var(--rune);
        font-weight: 700;
      }

      /* ── alert tiers ──
         --ember is the "gains only" colour, so subs/gifts/raids earn it.
         Follows and cheers stay in the violet/rune family. */
      #oracle.t-sub .cloth,
      #oracle.t-gift .cloth,
      #oracle.t-massgift .cloth {
        background: linear-gradient(
          180deg,
          rgba(94, 46, 12, 0.94),
          rgba(28, 10, 40, 0.92)
        );
        border-left-color: rgba(232, 163, 61, 0.55);
        border-right-color: rgba(232, 163, 61, 0.55);
      }
      #oracle.t-sub .rod,
      #oracle.t-gift .rod,
      #oracle.t-massgift .rod {
        background: linear-gradient(
          90deg,
          transparent,
          var(--ember) 12%,
          var(--cream) 50%,
          var(--ember) 88%,
          transparent
        );
      }
      #oracle.t-sub #oWho,
      #oracle.t-gift #oWho,
      #oracle.t-massgift #oWho,
      #oracle.t-raid #oWho {
        color: var(--ember);
      }
      #oracle.t-sub #oLine b,
      #oracle.t-gift #oLine b,
      #oracle.t-massgift #oLine b,
      #oracle.t-raid #oLine b {
        color: var(--ember);
      }

      #oracle.t-raid .cloth {
        background: linear-gradient(
          180deg,
          rgba(61, 15, 138, 0.96),
          rgba(94, 46, 12, 0.9)
        );
        border-left-color: rgba(232, 163, 61, 0.6);
        border-right-color: rgba(232, 163, 61, 0.6);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.8),
          0 0 40px rgba(232, 163, 61, 0.18);
      }
      #oracle.t-raid .rod {
        background: linear-gradient(
          90deg,
          transparent,
          var(--rune) 12%,
          var(--ember) 50%,
          var(--rune) 88%,
          transparent
        );
      }
      /* the two loudest moments get a slightly larger voice */
      #oracle.t-raid #oLine,
      #oracle.t-massgift #oLine {
        font-size: 27px;
      }

      #oracle.t-cheer .cloth {
        border-left-color: rgba(232, 163, 61, 0.4);
        border-right-color: rgba(232, 163, 61, 0.4);
      }
      #oracle.t-cheer #oWho {
        color: var(--ember);
      }

      /* ── token / connection notice (corner, deliberately tiny) ── */
      #notice {
        position: absolute;
        left: 26px;
        top: 96px;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--ember);
        opacity: 0;
        transition: opacity 0.6s;
        text-shadow: 0 1px 6px #000;
        pointer-events: none;
      }
      #notice.on {
        opacity: 0.9;
      }

      /* ───────────────────────── POLL ───────────────────────── */
      #poll {
        position: absolute;
        left: 470px;
        top: 620px;
        width: 560px;
        opacity: 0;
        transform: translateY(10px);
        transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #poll.on {
        opacity: 1;
        transform: none;
      }
      #pq {
        font-size: 15px;
        color: var(--cream);
        letter-spacing: 0.06em;
        font-weight: 600;
        margin-bottom: 9px;
        text-shadow: 0 2px 8px #000;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }
      #pTime {
        font-size: 17px;
        color: var(--rune);
      }
      #pBar {
        height: 26px;
        display: flex;
        overflow: hidden;
        border: 1px solid rgba(169, 123, 255, 0.3);
        background: rgba(10, 6, 18, 0.72);
      }
      #pBar > div {
        display: flex;
        align-items: center;
        padding: 0 11px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        white-space: nowrap;
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      #pA {
        background: linear-gradient(90deg, var(--deep), var(--violet));
        color: var(--cream);
      }
      #pB {
        background: rgba(243, 238, 228, 0.9);
        color: var(--ink);
        justify-content: flex-end;
      }

      /* ─────────────────── SAFE-ZONE GUIDE (?guide=1) ─────────────────── */
      .zone {
        position: absolute;
        border: 1px dashed rgba(255, 80, 80, 0.8);
        background: rgba(255, 0, 0, 0.08);
        font-size: 12px;
        color: #fff;
        padding: 3px 6px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        display: none;
      }
      body.guide .zone {
        display: block;
      }
      /* ─────────────────── OAUTH HELPER (one-off, not part of the stream) ─────────────────── */
      #oauthHelper {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 6, 18, 0.92);
        font-family: "Rajdhani", system-ui, sans-serif;
      }
      #oauthHelper .card {
        width: min(560px, 92vw);
        padding: 30px 34px;
        background: linear-gradient(
          180deg,
          rgba(61, 15, 138, 0.5),
          rgba(20, 6, 48, 0.85)
        );
        border: 1px solid rgba(169, 123, 255, 0.35);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75);
      }
      #oauthHelper h1 {
        font-size: 20px;
        color: #f3eee4;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 18px;
      }
      #oauthHelper label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(243, 238, 228, 0.55);
        font-weight: 600;
        margin-top: 16px;
      }
      #oauthHelper input,
      #oauthHelper textarea {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 10px 12px;
        background: rgba(10, 6, 18, 0.6);
        border: 1px solid rgba(169, 123, 255, 0.3);
        color: #f3eee4;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 15px;
        border-radius: 2px;
      }
      #oauthHelper textarea {
        height: 76px;
        resize: none;
        word-break: break-all;
      }
      #oauthHelper button {
        margin-top: 18px;
        padding: 10px 22px;
        background: linear-gradient(90deg, #3d0f8a, #7a2ff2);
        color: #f3eee4;
        border: none;
        border-radius: 2px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 12px;
        cursor: pointer;
      }
      #oauthHelper .hint {
        margin-top: 14px;
        font-size: 12px;
        color: rgba(243, 238, 228, 0.5);
        line-height: 1.5;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <!-- keep-out zones for alignment, toggle with ?guide=1 -->
      <div class="zone" style="left: 0; top: 0; width: 502px; height: 70px">
        buffs
      </div>
      <div
        class="zone"
        style="left: 1050px; top: 24px; width: 200px; height: 170px"
      >
        map info
      </div>
      <div
        class="zone"
        style="left: 1255px; top: 0; width: 665px; height: 1080px"
      >
        inventory / minimap
      </div>
      <div
        class="zone"
        style="left: 0; top: 760px; width: 210px; height: 110px"
      >
        life · shield · ward
      </div>
      <div
        class="zone"
        style="left: 0; top: 880px; width: 1920px; height: 200px"
      >
        flasks · skills · orbs
      </div>

      <!-- ══ LEFT RAIL ══ -->
      <div id="rail">
        <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 2 2 6v14h5v3h3l3-3h4l5-5V2H4zm16 12-3 3h-4l-3 3v-3H7V4h13v10zM11 7h2v6h-2V7zm5 0h2v6h-2V7z"
          />
        </svg>
        <div id="railName">Rawad</div>
        <div class="hair"><div class="ticks" id="ticks"></div></div>
        <svg id="crosshair" viewBox="0 0 34 34" aria-hidden="true">
          <circle cx="17" cy="17" r="9" />
          <circle class="core" cx="17" cy="17" r="2.4" />
          <line x1="17" y1="0" x2="17" y2="5" />
          <line x1="17" y1="29" x2="17" y2="34" />
          <line x1="0" y1="17" x2="5" y2="17" />
          <line x1="29" y1="17" x2="34" y2="17" />
        </svg>
        <div class="hair"></div>
        <div id="clock" class="num">00:00:00</div>
      </div>

      <!-- ══ TOP STRIP ══ -->
      <div id="strip">
        <div id="moonWrap">
          <svg id="moonSvg" viewBox="0 0 52 52" width="52" height="52">
            <defs>
              <radialGradient id="lit" cx="38%" cy="34%">
                <stop offset="0%" stop-color="#FFFBF2" />
                <stop offset="100%" stop-color="#CDBBEB" />
              </radialGradient>
              <mask id="phase">
                <circle cx="26" cy="26" r="19" fill="#fff" />
                <circle id="shadow" cx="26" cy="26" r="19" fill="#000" />
              </mask>
            </defs>
            <circle
              cx="26"
              cy="26"
              r="19"
              fill="rgba(122,47,242,.13)"
              stroke="rgba(169,123,255,.4)"
              stroke-width="1"
            />
            <circle
              cx="26"
              cy="26"
              r="19"
              fill="url(#lit)"
              mask="url(#phase)"
            />
          </svg>
          <!-- brush-stroke ring, echoes the swoosh under the wordmark -->
          <svg id="moonRing" viewBox="0 0 64 64">
            <path d="M55 20a26 26 0 1 1-19-13" stroke-dasharray="1 0" />
          </svg>
        </div>

        <div class="meters">
          <div id="chatLabel">Chat energy · <b id="phaseName">New moon</b></div>
          <div id="track"><div id="fill"></div></div>
          <div id="quietHint" class="cap">
            The moon awaits — type <b>!fate</b>
          </div>
        </div>

        <div id="tally">
          <div class="stat" id="s-maps">
            <span class="v num">0</span><span class="k">Maps</span>
          </div>
          <div class="stat" id="s-deaths">
            <span class="v num">0</span><span class="k">Deaths</span>
          </div>
          <div class="stat" id="s-mirrors">
            <span class="v num">0</span><span class="k">Mirrors</span>
          </div>
        </div>
      </div>

      <!-- ══ POLL ══ -->
      <div id="poll">
        <div id="pq">
          <span id="pText">—</span><span id="pTime" class="num">60</span>
        </div>
        <div id="pBar">
          <div id="pA" style="width: 50%">!1</div>
          <div id="pB" style="width: 50%">!2</div>
        </div>
      </div>

      <!-- ══ TOKEN / CONNECTION NOTICE ══ -->
      <div id="notice"></div>

      <!-- ══ ORACLE BANNER ══ -->
      <div id="oracle">
        <div class="rod"></div>
        <div class="cloth">
          <div id="oWho">The moon answers —</div>
          <div id="oLine">…</div>
        </div>
      </div>
    </div>

    <script>
      /* ═══════════════════════════════════════════════════════════════
   CONFIG — edit this block, nothing else needs touching
   ═══════════════════════════════════════════════════════════════ */
      const CONFIG = {
        channel: "rawad663", // ← your Twitch login, lowercase, no #
        fullMoonMessages: 25, // messages in a 60s window = full moon
        fateCooldown: 120, // seconds each viewer must wait between !fate
        fateGlobalGap: 6, // min seconds between two oracle banners
        pollSeconds: 60,

        // ── alerts ──
        clientId: "", // ← Twitch app client id (not secret). Follows need this + ?token=
        bigCheer: 1000, // bits at or above this get the loud treatment
        alertGap: 650, // ms of breathing room between two banners
        queueCap: 10, // above this, the least important alerts get dropped
        volume: 0.5, // 0–1, override per-source with ?volume=
      };

      /* ── scale the 1920×1080 stage to whatever the source is sized at ── */
      const stage = document.getElementById("stage");
      function fit() {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        stage.style.transform = `scale(${s})`;
        stage.style.left = (innerWidth - 1920 * s) / 2 + "px";
      }
      addEventListener("resize", fit);
      fit();

      const qs = new URLSearchParams(location.search);
      const inOBS = !!window.obsstudio;
      if (qs.get("guide") === "1") document.body.classList.add("guide");
      // Outside OBS, show a backdrop and fake traffic so you can preview it in a browser.
      const DEMO = qs.get("demo") === "1" || (!inOBS && qs.get("live") !== "1");
      if (DEMO) document.body.classList.add("bg");

      /* Secrets never live in this file — the repo is public. The token is
         passed in the OBS browser-source URL, which stays on your machine. */
      const TOKEN = qs.get("token") || "";
      const CLIENT_ID = qs.get("client_id") || CONFIG.clientId;
      const MUTED = qs.get("mute") === "1";
      if (qs.has("volume")) {
        const v = parseFloat(qs.get("volume"));
        if (!isNaN(v)) CONFIG.volume = Math.max(0, Math.min(1, v));
      }

      /* ── OAuth helper ──
         After the Twitch authorize redirect, the token lands in the URL
         *fragment* (#access_token=...), not a query param, and Twitch never
         sends it back through anything but the browser — so this has to
         happen client-side. Detect it, build the ready-to-paste OBS URL, and
         scrub the token out of the address bar the moment it's read. */
      (function oauthHelper() {
        const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
        const token = hash.get("access_token");
        if (!token) return;
        history.replaceState(null, "", location.pathname + location.search);

        const savedClientId = localStorage.getItem("rawad-clientid") || "";
        const box = document.createElement("div");
        box.id = "oauthHelper";
        box.innerHTML =
          '<div class="card">' +
          "<h1>Follow-alert token ready</h1>" +
          '<label>Client ID<input id="ohClientId" spellcheck="false" placeholder="paste your Client ID"></label>' +
          '<label>OBS browser-source URL<textarea id="ohUrl" readonly spellcheck="false"></textarea></label>' +
          '<button id="ohCopy" type="button">Copy URL</button>' +
          '<p class="hint">Paste this whole URL into OBS’s browser source. The token expires in ~60 days.</p>' +
          "</div>";
        document.body.appendChild(box);

        const idInput = box.querySelector("#ohClientId");
        const urlBox = box.querySelector("#ohUrl");
        const copyBtn = box.querySelector("#ohCopy");
        idInput.value = savedClientId;

        function rebuild() {
          const cid = idInput.value.trim();
          if (cid) localStorage.setItem("rawad-clientid", cid);
          const base = location.origin + location.pathname;
          urlBox.value =
            base +
            "?live=1&client_id=" +
            encodeURIComponent(cid || "YOUR_CLIENT_ID") +
            "&token=" +
            encodeURIComponent(token);
        }
        idInput.addEventListener("input", rebuild);
        copyBtn.addEventListener("click", () => {
          urlBox.select();
          navigator.clipboard
            .writeText(urlBox.value)
            .then(() => (copyBtn.textContent = "Copied!"))
            .catch(() => document.execCommand("copy"));
          setTimeout(() => (copyBtn.textContent = "Copy URL"), 1600);
        });
        rebuild();
      })();

      /* ── rail tick marks ── */
      {
        const t = document.getElementById("ticks");
        for (let i = 0; i < 26; i++) {
          const el = document.createElement("i");
          el.style.top = i * 3.85 + "%";
          el.style.width = (i % 5 === 0 ? 13 : 6) + "px";
          el.style.opacity = i % 5 === 0 ? 0.8 : 0.32;
          t.appendChild(el);
        }
      }

      /* ── session clock ── */
      const t0 = Date.now(),
        clock = document.getElementById("clock");
      setInterval(() => {
        const s = Math.floor((Date.now() - t0) / 1000);
        clock.textContent = [s / 3600, (s / 60) % 60, s % 60]
          .map((n) => String(Math.floor(n)).padStart(2, "0"))
          .join(":");
      }, 1000);

      /* ═══════════════════ THE MOON (chat energy meter) ═══════════════════ */
      const PHASES = [
        "New moon",
        "Waxing crescent",
        "First quarter",
        "Waxing gibbous",
        "Full moon",
      ];
      const shadow = document.getElementById("shadow");
      const fill = document.getElementById("fill");
      const phaseName = document.getElementById("phaseName");
      const moonWrap = document.getElementById("moonWrap");
      const quietHint = document.getElementById("quietHint");
      let beats = [],
        fullUntil = 0;

      /* ── quiet-chat hint ── */
      const QUIET_THRESHOLD = 0.25;
      const QUIET_HOLD_MS = 30000;
      const QUIET_GRACE_MS = 45000;
      let quietStart = null,
        hintVisible = false;

      function hintSuppressed() {
        // stay down while anything is queued, not just while one is animating
        return Director.active() || pollEl.classList.contains("on");
      }
      function showHint() {
        hintVisible = true;
        quietHint.classList.add("show");
      }
      function hideHint() {
        hintVisible = false;
        quietHint.classList.remove("show");
      }
      function updateHint(p, now) {
        if (p >= QUIET_THRESHOLD) {
          if (hintVisible) hideHint();
          quietStart = null;
          return;
        }
        if (quietStart === null) quietStart = now;

        const suppressed = hintSuppressed();
        if (hintVisible) {
          if (suppressed) {
            hideHint();
            quietStart = now; // 30s timer restarts from zero
          }
          return;
        }
        const pastGrace = now - t0 >= QUIET_GRACE_MS;
        if (pastGrace && !suppressed && now - quietStart >= QUIET_HOLD_MS) {
          showHint();
        }
      }

      function ping() {
        beats.push(Date.now());
      }

      function drawMoon() {
        const now = Date.now();
        beats = beats.filter((t) => now - t < 60000);
        const p = Math.min(1, beats.length / CONFIG.fullMoonMessages);

        shadow.setAttribute("cx", 26 + p * 40); // slide the shadow off → waxing
        fill.style.width = p * 100 + "%";
        phaseName.textContent = PHASES[Math.min(4, Math.floor(p * 4.999))];
        updateHint(p, now);

        if (p >= 1 && now > fullUntil) {
          fullUntil = now + 20000;
          moonWrap.classList.add("full");
          setTimeout(() => moonWrap.classList.remove("full"), 1700);
          say(
            "The moon is full.",
            "Chat lit it up — " + beats.length + " messages this minute."
          );
        }
      }
      setInterval(drawMoon, 900);

      /* ═══════════════════ ORACLE (!fate) ═══════════════════ */
      const FATES = [
        "The next rare you touch is worth more than you think. Sell it.",
        "Something in your stash has been waiting three leagues to be useful.",
        "You will die to a mechanic you have explained to chat before.",
        "Turn around. You walked past it.",
        "Your next six maps are quiet. The seventh is not.",
        "The build works. The pilot is the variable.",
        "Greed costs one portal tonight. Spend it early.",
        "A currency drop lands while you are reading this.",
        "You have enough regrets. Craft the item.",
        "The map you keep skipping holds the good one.",
        "Someone in chat is about to say the thing you needed to hear.",
        "Your gear is fine. Your resistances are not.",
        "Trade offer incoming. Take it.",
        "The boss dies this attempt if you stop dodging backwards.",
        "You are two levels from the passive that fixes everything.",
        "Log off one map later than you planned. Just one.",
        "A stranger will vouch for you tonight.",
        "That vendor recipe you forgot is worth doing.",
        "Nothing rare drops for an hour. Then everything does.",
        "The loot filter is hiding it from you on purpose.",
        "Your hideout is fine. Nobody is judging it. Some are.",
        "Patience, then violence. In that order.",
        "You will misclick something expensive. Breathe first.",
        "The moon says: hydrate, then run one more.",
      ];
      const oracle = document.getElementById("oracle");
      const oWho = document.getElementById("oWho");
      const oLine = document.getElementById("oLine");
      let fateLog = new Map();

      const pick = (a) => a[(Math.random() * a.length) | 0];
      // usernames come from chat — always escape before touching innerHTML
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c]
        );
      const b = (s) => "<b>" + esc(s) + "</b>";

      /* ═══════════════════ SOUND (synthesised — no files) ═══════════════════
         Bell-ish tones from a minor pentatonic set, so alerts sound like the
         rest of the overlay looks. Only subs and above make noise; follows,
         small cheers and fates stay silent so audio still means something. */
      const Sound = {
        ctx: null,
        vol: CONFIG.volume,
        muted: MUTED,

        ready() {
          if (this.muted) return null;
          try {
            if (!this.ctx) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return null;
              this.ctx = new AC();
            }
            // OBS autoplays fine; a normal browser tab stays suspended till a click
            if (this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
            return this.ctx.state === "running" ? this.ctx : null;
          } catch (e) {
            return null;
          }
        },

        // one struck bell: fundamental + two quieter partials, exponential decay
        bell(ctx, freq, at, dur, gain) {
          const t = ctx.currentTime + at;
          [
            [1, 1],
            [2.01, 0.34], // slightly sharp — gives the shimmer
            [3.02, 0.14],
          ].forEach(([mult, amp]) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = "sine";
            o.frequency.value = freq * mult;
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(
              Math.max(0.0002, gain * amp * this.vol),
              t + 0.012
            );
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(ctx.destination);
            o.start(t);
            o.stop(t + dur + 0.05);
          });
        },

        // low rising swell, used to make a raid feel like weather
        swell(ctx, at, dur) {
          const t = ctx.currentTime + at;
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = "triangle";
          o.frequency.setValueAtTime(82, t);
          o.frequency.exponentialRampToValueAtTime(220, t + dur);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.28 * this.vol, t + dur * 0.6);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g).connect(ctx.destination);
          o.start(t);
          o.stop(t + dur + 0.05);
        },

        play(name) {
          if (!name) return;
          const ctx = this.ready();
          if (!ctx) return;
          const A3 = 220,
            C4 = 261.63,
            D4 = 293.66,
            E4 = 329.63,
            G4 = 392,
            A4 = 440,
            E5 = 659.25;
          try {
            if (name === "sub") {
              this.bell(ctx, A3, 0, 1.7, 0.3);
              this.bell(ctx, C4, 0.13, 1.7, 0.3);
              this.bell(ctx, E4, 0.26, 2.1, 0.32);
            } else if (name === "gift") {
              this.bell(ctx, A3, 0, 1.7, 0.3);
              this.bell(ctx, C4, 0.13, 1.7, 0.3);
              this.bell(ctx, E4, 0.26, 2.1, 0.32);
              this.bell(ctx, A4, 0.42, 2.4, 0.2); // extra shimmer on top
            } else if (name === "massgift") {
              [A3, C4, E4, A4].forEach((f, i) =>
                this.bell(ctx, f, i * 0.04, 2.6, 0.26)
              );
              this.bell(ctx, E5, 0.5, 2.6, 0.16);
            } else if (name === "raid") {
              this.swell(ctx, 0, 1.1);
              this.bell(ctx, A4, 0.9, 2.4, 0.3);
              this.bell(ctx, E5, 1.05, 2.6, 0.22);
            } else if (name === "cheer") {
              this.bell(ctx, E4, 0, 0.9, 0.24);
              this.bell(ctx, G4, 0.09, 0.9, 0.24);
              this.bell(ctx, A4, 0.18, 1.3, 0.26);
            }
          } catch (e) {
            /* never let audio break the overlay */
          }
        },
      };

      /* ═══════════════════ THE DIRECTOR ═══════════════════
         One queue, one banner element — so two alerts can never stack. Every
         banner in the overlay (alerts, fates, poll results) goes through here. */
      const TIERS = {
        raid: { prio: 50, dur: 8500, sound: "raid" },
        massgift: { prio: 45, dur: 8000, sound: "massgift" },
        sub: { prio: 40, dur: 7000, sound: "sub" },
        gift: { prio: 40, dur: 7000, sound: "gift" },
        bigcheer: { prio: 35, dur: 7000, sound: "cheer", tier: "cheer" },
        cheer: { prio: 20, dur: 5500, sound: null, tier: "cheer" },
        follow: { prio: 15, dur: 4500, sound: null },
        system: { prio: 10, dur: 9400, sound: null, tier: null },
      };

      /* Events that land together should play in priority order, but priority
         only sorts what's already queued — so hold briefly before the first
         banner and let a burst settle. Imperceptible live; the difference
         between a raid leading and a stray follow blocking it for 4.5s. */
      const SETTLE = 250,
        SETTLE_MAX = 550;

      const Director = {
        q: [],
        showing: null,
        lastEnd: 0,
        timer: null,
        lastPush: 0,
        firstPending: 0,

        active() {
          return !!this.showing || this.q.length > 0;
        },

        push(type, who, html, extra) {
          const spec = TIERS[type] || TIERS.system;
          const evt = Object.assign(
            {
              type,
              who,
              html,
              prio: spec.prio,
              dur: spec.dur,
              sound: spec.sound,
              tier: "tier" in spec ? spec.tier : type,
            },
            extra || {}
          );

          const now = Date.now();
          this.lastPush = now;
          if (!this.q.length && !this.showing) this.firstPending = now;

          // insert by priority, FIFO within a priority
          let i = this.q.findIndex((e) => e.prio < evt.prio);
          if (i === -1) this.q.push(evt);
          else this.q.splice(i, 0, evt);

          // over cap, shed the least important — a sub/gift/raid is never dropped
          while (this.q.length > CONFIG.queueCap) {
            let lowest = 0;
            for (let j = 1; j < this.q.length; j++)
              if (this.q[j].prio <= this.q[lowest].prio) lowest = j;
            this.q.splice(lowest, 1);
          }

          this.pump();
          return evt;
        },

        pump() {
          if (this.showing || this.timer || !this.q.length) return;
          const now = Date.now();
          // breathing room after the last banner, and a moment for bursts to settle
          const settleTo = Math.min(
            this.lastPush + SETTLE,
            this.firstPending + SETTLE_MAX
          );
          const wait = Math.max(
            0,
            this.lastEnd + CONFIG.alertGap - now,
            settleTo - now
          );
          if (wait > 0) {
            this.timer = setTimeout(() => {
              this.timer = null;
              this.pump();
            }, wait);
            return;
          }
          this.render(this.q.shift());
        },

        render(evt) {
          this.showing = evt;
          oWho.textContent = evt.who;
          oLine.innerHTML = evt.html;
          oracle.className = ""; // drop any previous tier + restart the animation
          void oracle.offsetWidth;
          if (evt.tier) oracle.classList.add("t-" + evt.tier);
          if (pollEl.classList.contains("on")) oracle.classList.add("lowered");
          oracle.style.animationDuration = evt.dur + "ms";
          oracle.classList.add("on");
          Sound.play(evt.sound);

          setTimeout(() => {
            this.showing = null;
            this.lastEnd = Date.now();
            oracle.classList.remove("on");
            this.pump();
          }, evt.dur);
        },
      };

      /* say() keeps its old shape so the moon, polls and !say still work */
      function say(who, line) {
        Director.push("system", who, esc(line));
        return true;
      }

      function fate(user) {
        const now = Date.now();
        if (now - (fateLog.get(user) || 0) < CONFIG.fateCooldown * 1000) return;
        fateLog.set(user, now);
        Director.push(
          "system",
          user + " asked the moon —",
          esc(pick(FATES))
        );
      }

      /* ═══════════════════ ALERTS ═══════════════════
         Same voice as the fates — the moon narrating, not a receipt printer. */
      const COPY = {
        follow: [
          "{u} stepped into the moonlight.",
          "{u} is watching the sky with us now.",
          "The moon noticed {u}. So have we.",
          "{u} joined the vigil.",
          "One more shadow around the fire. Welcome, {u}.",
          "{u} followed the light all the way here.",
        ],
        follows: [
          "{n} new souls stepped into the moonlight.",
          "{n} more shadows around the fire. Welcome, all of you.",
          "The moon counted {n} arrivals. It approves.",
        ],
        sub: [
          "{u} swore an oath to the moon.",
          "The moon has a new devotee: {u}.",
          "{u} signed the pact. No takebacks.",
          "{u} chose the long night. Good choice.",
        ],
        resub: [
          "{u} has kept the vigil {n} months.",
          "{n} months and {u} still hasn't looked away.",
          "{u} renews the pact — {n} months deep.",
          "{n} months of loyalty from {u}. The moon remembers.",
        ],
        gift: [
          "{u} gifted {r} a sub. Generosity is its own magic.",
          "{u} handed {r} a place by the fire.",
          "{r} got pulled into the light by {u}.",
          "{u} paid {r}'s way into the vigil.",
        ],
        massgift: [
          "{u} loosed {n} subs on the sky.",
          "{n} subs from {u}. The whole chat owes them a drink.",
          "{u} went full moon and gifted {n}.",
          "{u} opened the vault — {n} subs, just like that.",
        ],
        raid: [
          "{u} broke through the clouds with {n}.",
          "{n} raiders behind {u}. Hold onto something.",
          "The sky splits — {u} arrives with {n}.",
          "{u} brought {n} souls with them. Make room.",
        ],
        cheer: [
          "{u} cheered {n} bits.",
          "{u} threw {n} bits at the moon.",
          "{n} bits from {u}. The moon accepts tribute.",
        ],
        bigcheer: [
          "{u} dropped {n} bits. The sky is listening.",
          "{n} bits from {u}. The moon actually flinched.",
          "{u} just lit the whole night up — {n} bits.",
        ],
      };

      const WHO = {
        follow: "A new follower —",
        follows: "The gates open —",
        sub: "An oath sworn —",
        resub: "The vigil continues —",
        gift: "A gift given —",
        massgift: "The sky opens —",
        raid: "A raid arrives —",
        cheer: "Bits in the dark —",
        bigcheer: "Tribute paid —",
      };

      // fill {u} {r} {n}, bolding the parts that matter
      function phrase(set, vals) {
        return pick(COPY[set]).replace(/\{(u|r|n)\}/g, (_, k) => b(vals[k]));
      }

      /* ── follows: merge any that are still waiting, so a raid-flood
            becomes one banner instead of twenty ── */
      function alertFollow(user) {
        const waiting = Director.q.find((e) => e.type === "follow");
        if (waiting) {
          waiting.names.push(user);
          const n = waiting.names.length;
          waiting.who = WHO.follows;
          waiting.html = phrase("follows", { n });
          return;
        }
        const evt = Director.push("follow", WHO.follow, phrase("follow", { u: user }));
        evt.names = [user];
      }

      function alertSub(user, months) {
        const m = parseInt(months) || 0;
        if (m > 1)
          Director.push("sub", WHO.resub, phrase("resub", { u: user, n: m }));
        else Director.push("sub", WHO.sub, phrase("sub", { u: user }));
      }

      /* Twitch sends submysterygift AND an individual subgift per recipient.
         Without this, a 20-sub bomb would fire 21 banners. */
      const giftBomb = new Map();

      function alertMassGift(user, count) {
        const n = parseInt(count) || 1;
        giftBomb.set(user, { left: n, until: Date.now() + 15000 });
        Director.push("massgift", WHO.massgift, phrase("massgift", { u: user, n }));
      }

      function alertGift(user, recipient) {
        const bomb = giftBomb.get(user);
        if (bomb && bomb.left > 0 && Date.now() < bomb.until) {
          bomb.left--; // part of a bomb we already announced
          return;
        }
        Director.push(
          "gift",
          WHO.gift,
          phrase("gift", { u: user, r: recipient || "someone" })
        );
      }

      function alertRaid(user, viewers) {
        const n = parseInt(viewers) || 0;
        Director.push("raid", WHO.raid, phrase("raid", { u: user, n }));
      }

      /* ── cheers: same user cheering repeatedly within a few seconds
            collapses into one banner rather than a stutter of them ── */
      const cheerLog = new Map();

      function alertCheer(user, bits) {
        const n = parseInt(bits) || 0;
        if (!n) return;
        const now = Date.now();
        const recent = cheerLog.get(user);
        if (recent && now - recent.at < 6000) {
          recent.at = now;
          recent.total += n;
          const t = recent.total;
          const big = t >= CONFIG.bigCheer;
          if (recent.evt && Director.q.includes(recent.evt)) {
            recent.evt.who = big ? WHO.bigcheer : WHO.cheer;
            recent.evt.html = phrase(big ? "bigcheer" : "cheer", { u: user, n: t });
            return;
          }
        }
        const big = n >= CONFIG.bigCheer;
        const evt = Director.push(
          big ? "bigcheer" : "cheer",
          big ? WHO.bigcheer : WHO.cheer,
          phrase(big ? "bigcheer" : "cheer", { u: user, n })
        );
        cheerLog.set(user, { at: now, total: n, evt });
      }

      /* ═══════════════════ TALLIES ═══════════════════ */
      const KEYS = {
        map: "maps",
        maps: "maps",
        death: "deaths",
        deaths: "deaths",
        mirror: "mirrors",
        mirrors: "mirrors",
      };
      let tally = { maps: 0, deaths: 0, mirrors: 0 };
      try {
        Object.assign(
          tally,
          JSON.parse(localStorage.getItem("rawad-tally") || "{}")
        );
      } catch (e) {}

      function paint(key, bump) {
        const box = document.getElementById("s-" + key);
        box.querySelector(".v").textContent = tally[key];
        if (bump) {
          box.classList.remove("hit");
          void box.offsetWidth;
          box.classList.add("hit");
        }
        try {
          localStorage.setItem("rawad-tally", JSON.stringify(tally));
        } catch (e) {}
      }
      Object.keys(tally).forEach((k) => paint(k, false));

      /* ═══════════════════ POLL ═══════════════════ */
      const pollEl = document.getElementById("poll");
      let poll = null,
        pollTimer = null;

      function openPoll(text, a, b) {
        poll = {
          a: 0,
          b: 0,
          voters: new Set(),
          ends: Date.now() + CONFIG.pollSeconds * 1000,
        };
        document.getElementById("pText").textContent = text;
        document.getElementById("pA").textContent = "!1 " + a;
        document.getElementById("pB").textContent = b + " !2";
        pollEl.classList.add("on");
        oracle.classList.add("lowered"); // keep clear of a banner already showing
        clearInterval(pollTimer);
        pollTimer = setInterval(tickPoll, 250);
        tickPoll();
      }
      function tickPoll() {
        if (!poll) return;
        const left = Math.max(0, Math.ceil((poll.ends - Date.now()) / 1000));
        document.getElementById("pTime").textContent = left;
        const tot = poll.a + poll.b;
        const pa = tot ? (poll.a / tot) * 100 : 50;
        document.getElementById("pA").style.width = pa + "%";
        document.getElementById("pB").style.width = 100 - pa + "%";
        if (left === 0) closePoll();
      }
      function closePoll() {
        clearInterval(pollTimer);
        const tot = poll ? poll.a + poll.b : 0;
        const pa = tot ? Math.round((poll.a / tot) * 100) : 0;
        setTimeout(() => {
          pollEl.classList.remove("on");
          oracle.classList.remove("lowered");
        }, 4000);
        if (tot)
          say(
            "Chat has decided —",
            pa + "% to " + (pa >= 50 ? "option one" : "option two") + "."
          );
        poll = null;
      }

      /* ═══════════════════ CHAT ═══════════════════ */
      /* USERNOTICE — subs, gifts and raids. All of this arrives on the
         anonymous connection; only follows need a token (see EventSub below). */
      function notice(m) {
        ping(); // hype should move the moon too
        const t = m.tags;
        switch (m.id) {
          case "sub":
          case "resub":
            return alertSub(m.user, t["msg-param-cumulative-months"]);
          case "subgift":
          case "anonsubgift":
            return alertGift(
              m.user,
              t["msg-param-recipient-display-name"] ||
                t["msg-param-recipient-user-name"]
            );
          case "submysterygift":
            return alertMassGift(m.user, t["msg-param-mass-gift-count"]);
          case "raid":
            return alertRaid(
              t["msg-param-displayName"] || m.user,
              t["msg-param-viewerCount"]
            );
        }
      }

      function handle(m) {
        if (m.kind === "notice") return notice(m);
        ping();
        if (m.bits) alertCheer(m.user, m.bits);
        const msg = m.msg;
        if (!msg.startsWith("!")) return;
        const [cmd, ...rest] = msg.slice(1).split(/\s+/);
        const arg = rest.join(" ");
        const c = cmd.toLowerCase();

        if (c === "fate") return fate(m.user);

        if (poll && (c === "1" || c === "2") && !poll.voters.has(m.login)) {
          poll.voters.add(m.login);
          poll[c === "1" ? "a" : "b"]++;
          return tickPoll();
        }

        if (!m.mod) return; // ── mod / broadcaster only ──
        if (KEYS[c]) {
          const k = KEYS[c];
          tally[k]++;
          return paint(k, true);
        }
        if (c === "undo" && KEYS[rest[0]]) {
          const k = KEYS[rest[0]];
          tally[k] = Math.max(0, tally[k] - 1);
          return paint(k, true);
        }
        if (c === "set" && KEYS[rest[0]]) {
          const k = KEYS[rest[0]];
          tally[k] = Math.max(0, parseInt(rest[1]) || 0);
          return paint(k, true);
        }
        if (c === "poll") {
          const parts = arg.split("|").map((s) => s.trim());
          return openPoll(
            parts[0] || "Yes or no?",
            parts[1] || "Yes",
            parts[2] || "No"
          );
        }
        if (c === "endpoll" && poll) return closePoll();
        if (c === "say" && arg) return say("Rawad says —", arg);
        if (c === "testalert") return testAlert(rest[0] || "sub", m.user);
      }

      /* fire a fake alert without waiting on a real one — !testalert raid, etc.
         "burst" throws everything at once to prove the queue serialises it. */
      function testAlert(kind, who) {
        const u = who || "test_viewer";
        switch ((kind || "").toLowerCase()) {
          case "follow":
            return alertFollow(u);
          case "resub":
            return alertSub(u, 14);
          case "gift":
            return alertGift(u, "someone_lucky");
          case "massgift":
            return alertMassGift(u, 20);
          case "raid":
            return alertRaid(u, 137);
          case "cheer":
            return alertCheer(u, 250);
          case "bigcheer":
            return alertCheer(u, 5000);
          case "burst":
            alertFollow("first_soul");
            alertCheer("bit_thrower", 300);
            alertSub("oath_keeper", 8);
            alertRaid("sky_breaker", 212);
            alertFollow("second_soul");
            alertFollow("third_soul");
            alertMassGift("big_spender", 20);
            return;
          default:
            return alertSub(u, 1);
        }
      }

      function connect() {
        const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
        ws.onopen = () => {
          // commands is what carries USERNOTICE (subs, gifts, raids)
          ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
          ws.send("NICK justinfan" + (((Math.random() * 90000) | 0) + 10000));
          ws.send("JOIN #" + CONFIG.channel.toLowerCase());
        };
        ws.onmessage = (e) => {
          for (const line of e.data.split("\r\n")) {
            if (!line) continue;
            if (line.startsWith("PING")) {
              ws.send("PONG :tmi.twitch.tv");
              continue;
            }
            const m = parse(line);
            if (m) handle(m);
          }
        };
        ws.onclose = () => setTimeout(connect, 4000);
        ws.onerror = () => ws.close();
      }

      // IRCv3 escapes these inside tag values — display names need unescaping
      const untag = (v) =>
        String(v).replace(
          /\\(.)/g,
          (_, c) => ({ s: " ", ":": ";", r: "\r", n: "\n", "\\": "\\" })[c] || c
        );

      function parse(raw) {
        let tags = {},
          rest = raw;
        if (rest[0] === "@") {
          const sp = rest.indexOf(" ");
          rest
            .slice(1, sp)
            .split(";")
            .forEach((kv) => {
              const i = kv.indexOf("=");
              tags[kv.slice(0, i)] = untag(kv.slice(i + 1));
            });
          rest = rest.slice(sp + 1);
        }

        // USERNOTICE comes from tmi.twitch.tv and often carries no trailing body
        if (/^:tmi\.twitch\.tv USERNOTICE #/.test(rest)) {
          return {
            kind: "notice",
            id: tags["msg-id"] || "",
            user: tags["display-name"] || tags.login || "someone",
            tags,
          };
        }

        const m = rest.match(/^:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :([\s\S]*)$/);
        if (!m) return null;
        const badges = tags.badges || "";
        return {
          kind: "chat",
          bits: parseInt(tags.bits) || 0,
          login: m[1],
          user: tags["display-name"] || m[1],
          msg: m[2].replace(/[\u0001\r\n]/g, "").trim(),
          mod: tags.mod === "1" || /broadcaster|moderator/.test(badges),
        };
      }

      /* ═══════════════════ FOLLOWS (EventSub) ═══════════════════
         Follows are the one event Twitch won't send over IRC, so they need a
         token. Without one this whole block no-ops and every other alert still
         works — an expired token must never make the overlay look broken. */
      const noticeEl = document.getElementById("notice");
      function showNotice(text) {
        noticeEl.textContent = text;
        noticeEl.classList.add("on");
      }
      function clearNotice() {
        noticeEl.classList.remove("on");
      }

      function helix(path, opts) {
        return fetch(
          "https://api.twitch.tv/helix/" + path,
          Object.assign(
            {
              headers: {
                "Client-Id": CLIENT_ID,
                Authorization: "Bearer " + TOKEN,
                "Content-Type": "application/json",
              },
            },
            opts
          )
        );
      }

      let esSocket = null,
        userId = null,
        esRetry = null;

      async function followsInit() {
        if (!TOKEN || !CLIENT_ID) return; // no token configured — stay quiet
        try {
          const r = await helix(
            "users?login=" + encodeURIComponent(CONFIG.channel)
          );
          if (r.status === 401) return showNotice("twitch token expired");
          const j = await r.json();
          userId = j.data && j.data[0] && j.data[0].id;
          if (!userId) return showNotice("channel not found");
          esConnect("wss://eventsub.wss.twitch.tv/ws");
        } catch (e) {
          showNotice("follow alerts offline");
        }
      }

      function esConnect(url) {
        const ws = new WebSocket(url);
        ws.onmessage = (e) => {
          let d;
          try {
            d = JSON.parse(e.data);
          } catch (_) {
            return;
          }
          const type = d.metadata && d.metadata.message_type;

          if (type === "session_welcome") {
            // on a reconnect handoff, only drop the old socket once this one is welcomed
            if (esSocket && esSocket !== ws) {
              try {
                esSocket.close();
              } catch (_) {}
            }
            esSocket = ws;
            esSubscribe(d.payload.session.id); // must happen within 10s
          } else if (type === "notification") {
            if (d.payload.subscription.type === "channel.follow") {
              const ev = d.payload.event || {};
              alertFollow(ev.user_name || ev.user_login || "someone");
            }
          } else if (type === "session_reconnect") {
            esConnect(d.payload.session.reconnect_url);
          } else if (type === "revocation") {
            showNotice("follow alerts revoked");
          }
        };
        ws.onclose = () => {
          if (esSocket !== ws) return; // superseded by a reconnect, nothing to do
          esSocket = null;
          clearTimeout(esRetry);
          esRetry = setTimeout(followsInit, 5000);
        };
        ws.onerror = () => {
          try {
            ws.close();
          } catch (_) {}
        };
      }

      async function esSubscribe(sessionId) {
        try {
          const r = await helix("eventsub/subscriptions", {
            method: "POST",
            body: JSON.stringify({
              type: "channel.follow",
              version: "2",
              condition: {
                broadcaster_user_id: userId,
                moderator_user_id: userId,
              },
              transport: { method: "websocket", session_id: sessionId },
            }),
          });
          if (r.ok) return clearNotice();
          showNotice(
            r.status === 401 ? "twitch token expired" : "follow alerts unavailable"
          );
        } catch (e) {
          showNotice("follow alerts offline");
        }
      }

      /* ═══════════════════ DEMO ═══════════════════ */
      if (DEMO) {
        const names = [
          "exilewick",
          "moonlitgg",
          "vaal_andy",
          "chris_wilson_fan",
          "kalandra",
          "zdps_enjoyer",
        ];
        setInterval(() => {
          if (Math.random() < 0.7) ping();
        }, 900);
        setTimeout(() => fate(pick(names)), 2500);
        setInterval(() => fate(pick(names)), 16000);

        // the burst is the real test: everything at once, on purpose
        setTimeout(() => testAlert("burst"), 4000);
        setTimeout(() => alertCheer(pick(names), 5000), 30000);
        setInterval(() => alertFollow(pick(names)), 21000);
        setInterval(() => alertSub(pick(names), 1 + ((Math.random() * 30) | 0)), 27000);
        setInterval(() => alertGift(pick(names), pick(names)), 41000);
        setTimeout(() => {
          openPoll("Does he clear this without dying?", "Clean", "Portal gone");
          const v = setInterval(() => {
            if (!poll) return clearInterval(v);
            poll[Math.random() < 0.62 ? "a" : "b"]++;
            tickPoll();
          }, 600);
        }, 8000);
        setTimeout(() => {
          tally.maps = 14;
          tally.deaths = 3;
          tally.mirrors = 1;
          Object.keys(tally).forEach((k) => paint(k, true));
        }, 1400);
      } else {
        connect();
        followsInit();
      }

      // a normal browser tab keeps audio suspended until a gesture; OBS doesn't care
      addEventListener("click", () => Sound.ready(), { once: true });
    </script>
  </body>
</html>
