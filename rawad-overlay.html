<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RAWAD — Stream Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ═══════════════════════════════════════════════════════════════
   RAWAD OVERLAY — design tokens
   violet    #7A2FF2   the brush swoosh under the wordmark
   deep      #3D0F8A   shadow side of the swoosh
   rune      #A97BFF   the thin tick marks / "GAME ON" rail text
   cream     #F3EEE4   the brush wordmark
   ember     #E8A33D   the castle sunset — reserved for gains only
   ═══════════════════════════════════════════════════════════════ */
      :root {
        --violet: #7a2ff2;
        --deep: #3d0f8a;
        --rune: #a97bff;
        --cream: #f3eee4;
        --ember: #e8a33d;
        --ink: #0a0612;
        --dim: rgba(243, 238, 228, 0.42);
        --glow: 0 0 18px rgba(122, 47, 242, 0.55);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Rajdhani", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body.bg {
        background: radial-gradient(
            120% 90% at 30% 20%,
            #241634 0%,
            #0a0612 60%
          ),
          #0a0612;
      }

      #stage {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
      }

      .num {
        font-family: "Barlow Condensed", sans-serif;
        font-variant-numeric: tabular-nums;
      }
      .cap {
        text-transform: uppercase;
        letter-spacing: 0.34em;
        font-weight: 600;
      }

      /* ───────────────────────── LEFT RAIL ───────────────────────── */
      #rail {
        position: absolute;
        left: 26px;
        top: 132px;
        width: 56px;
        height: 680px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        opacity: 0;
        animation: railIn 1.1s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes railIn {
        to {
          opacity: 1;
        }
      }
      #rail .hair {
        width: 1px;
        flex: 1;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(169, 123, 255, 0.55) 18%,
          rgba(169, 123, 255, 0.55) 82%,
          transparent
        );
      }
      #rail .ticks {
        position: absolute;
        left: 27px;
        top: 0;
        height: 100%;
        width: 14px;
      }
      #rail .ticks i {
        position: absolute;
        left: 0;
        width: 9px;
        height: 1px;
        background: var(--rune);
        opacity: 0.7;
      }
      .glyph {
        width: 24px;
        height: 24px;
        fill: var(--violet);
        filter: drop-shadow(var(--glow));
      }
      #railName {
        writing-mode: vertical-rl;
        font-size: 15px;
        color: var(--cream);
        letter-spacing: 0.46em;
        text-transform: uppercase;
        font-weight: 600;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      }
      #clock {
        writing-mode: vertical-rl;
        font-size: 19px;
        color: var(--rune);
        letter-spacing: 0.22em;
        opacity: 0.85;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      }
      #crosshair {
        width: 34px;
        height: 34px;
      }
      #crosshair circle,
      #crosshair line {
        stroke: var(--rune);
        fill: none;
        stroke-width: 1;
      }
      #crosshair .core {
        fill: var(--violet);
        stroke: none;
      }

      /* ───────────────────── TOP STRIP (safe lane) ───────────────────── */
      /* Sits between PoE's buff icons (ends ~x502) and the map info text (~x1050) */
      #strip {
        position: absolute;
        left: 520px;
        top: 16px;
        width: 520px;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 20px;
        opacity: 0;
        transform: translateY(-12px);
        animation: stripIn 0.9s 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes stripIn {
        to {
          opacity: 1;
          transform: none;
        }
      }

      #moonWrap {
        position: relative;
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
      }
      #moonRing {
        position: absolute;
        inset: -6px;
        opacity: 0;
        transform: scale(0.85);
      }
      #moonRing path {
        fill: none;
        stroke: var(--violet);
        stroke-width: 3;
        stroke-linecap: round;
      }
      #moonWrap.full #moonRing {
        animation: flare 1.6s ease-out;
      }
      @keyframes flare {
        0% {
          opacity: 0;
          transform: scale(0.85) rotate(-8deg);
        }
        30% {
          opacity: 1;
          transform: scale(1.06) rotate(2deg);
        }
        100% {
          opacity: 0;
          transform: scale(1.3) rotate(10deg);
        }
      }
      #moonWrap.full #moonSvg {
        filter: drop-shadow(0 0 14px rgba(232, 163, 61, 0.85));
      }

      .meters {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 0;
      }
      #chatLabel {
        font-size: 11.5px;
        color: var(--dim);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-weight: 600;
        white-space: nowrap;
        text-shadow: 0 1px 6px #000;
      }
      #chatLabel b {
        color: var(--cream);
        font-weight: 700;
      }
      #track {
        height: 3px;
        background: rgba(243, 238, 228, 0.14);
        border-radius: 2px;
        overflow: hidden;
      }
      #fill {
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          var(--deep),
          var(--violet) 70%,
          var(--rune)
        );
        box-shadow: 0 0 10px rgba(122, 47, 242, 0.8);
        transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #quietHint {
        position: absolute;
        left: 0;
        top: 60px;
        width: 100%;
        font-size: 11.5px;
        letter-spacing: 0.12em;
        white-space: nowrap;
        color: var(--rune);
        text-shadow: 0 1px 6px #000;
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
      }
      #quietHint.show {
        opacity: 1;
        transform: none;
      }
      #quietHint b {
        color: var(--cream);
        font-weight: 700;
      }

      #tally {
        display: flex;
        gap: 16px;
        flex: 0 0 auto;
      }
      .stat {
        text-align: center;
        min-width: 34px;
      }
      .stat .v {
        display: block;
        font-size: 25px;
        line-height: 0.9;
        color: var(--cream);
        font-weight: 700;
        text-shadow: 0 2px 8px #000;
      }
      .stat .k {
        display: block;
        font-size: 9px;
        color: var(--dim);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 600;
        margin-top: 3px;
      }
      .stat.hit .v {
        animation: pop 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes pop {
        0% {
          transform: scale(1);
        }
        30% {
          transform: scale(1.5);
          color: var(--ember);
        }
        100% {
          transform: scale(1);
        }
      }

      /* ─────────────────── ORACLE BANNER (bottom centre) ─────────────────── */
      #oracle {
        position: absolute;
        left: 470px;
        top: 690px;
        width: 560px;
        transform-origin: top center;
        pointer-events: none;
        opacity: 0;
        transform: scaleY(0);
      }
      #oracle.on {
        animation: unfurl 9.4s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }
      /* a live poll is only 13px above the banner — drop it a touch so the two
         read as separate things. Still clears the flask bar at y880. */
      #oracle.lowered {
        top: 716px;
      }
      @keyframes unfurl {
        0% {
          opacity: 0;
          transform: scaleY(0);
        }
        8% {
          opacity: 1;
          transform: scaleY(1);
        }
        88% {
          opacity: 1;
          transform: scaleY(1);
        }
        100% {
          opacity: 0;
          transform: scaleY(0);
        }
      }
      #oracle .rod {
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--rune) 12%,
          var(--cream) 50%,
          var(--rune) 88%,
          transparent
        );
      }
      #oracle .cloth {
        position: relative;
        padding: 16px 26px 30px;
        background: linear-gradient(
          180deg,
          rgba(61, 15, 138, 0.94),
          rgba(20, 6, 48, 0.9)
        );
        clip-path: polygon(
          0 0,
          100% 0,
          100% calc(100% - 16px),
          50% 100%,
          0 calc(100% - 16px)
        );
        border-left: 1px solid rgba(169, 123, 255, 0.35);
        border-right: 1px solid rgba(169, 123, 255, 0.35);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75);
      }
      #oWho {
        font-size: 11px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--rune);
        font-weight: 700;
        margin-bottom: 8px;
      }
      #oLine {
        font-size: 23px;
        color: var(--cream);
        line-height: 1.34;
        font-weight: 500;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      }
      #oLine b {
        color: var(--rune);
        font-weight: 700;
      }

      /* ── alert tiers ──
         --ember is the "gains only" colour, so subs/gifts/raids earn it.
         Follows and cheers stay in the violet/rune family. */
      #oracle.t-sub .cloth,
      #oracle.t-gift .cloth,
      #oracle.t-massgift .cloth {
        background: linear-gradient(
          180deg,
          rgba(94, 46, 12, 0.94),
          rgba(28, 10, 40, 0.92)
        );
        border-left-color: rgba(232, 163, 61, 0.55);
        border-right-color: rgba(232, 163, 61, 0.55);
      }
      #oracle.t-sub .rod,
      #oracle.t-gift .rod,
      #oracle.t-massgift .rod {
        background: linear-gradient(
          90deg,
          transparent,
          var(--ember) 12%,
          var(--cream) 50%,
          var(--ember) 88%,
          transparent
        );
      }
      #oracle.t-sub #oWho,
      #oracle.t-gift #oWho,
      #oracle.t-massgift #oWho,
      #oracle.t-raid #oWho {
        color: var(--ember);
      }
      #oracle.t-sub #oLine b,
      #oracle.t-gift #oLine b,
      #oracle.t-massgift #oLine b,
      #oracle.t-raid #oLine b {
        color: var(--ember);
      }

      #oracle.t-raid .cloth {
        background: linear-gradient(
          180deg,
          rgba(61, 15, 138, 0.96),
          rgba(94, 46, 12, 0.9)
        );
        border-left-color: rgba(232, 163, 61, 0.6);
        border-right-color: rgba(232, 163, 61, 0.6);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.8),
          0 0 40px rgba(232, 163, 61, 0.18);
      }
      #oracle.t-raid .rod {
        background: linear-gradient(
          90deg,
          transparent,
          var(--rune) 12%,
          var(--ember) 50%,
          var(--rune) 88%,
          transparent
        );
      }
      /* the two loudest moments get a slightly larger voice */
      #oracle.t-raid #oLine,
      #oracle.t-massgift #oLine {
        font-size: 27px;
      }

      #oracle.t-cheer .cloth {
        border-left-color: rgba(232, 163, 61, 0.4);
        border-right-color: rgba(232, 163, 61, 0.4);
      }
      #oracle.t-cheer #oWho {
        color: var(--ember);
      }

      /* ── token / connection notice (corner, deliberately tiny) ── */
      #notice {
        position: absolute;
        left: 26px;
        top: 96px;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 600;
        color: var(--ember);
        opacity: 0;
        transition: opacity 0.6s;
        text-shadow: 0 1px 6px #000;
        pointer-events: none;
      }
      #notice.on {
        opacity: 0.9;
      }

      /* ───────────────────────── POLL ───────────────────────── */
      #poll {
        position: absolute;
        left: 470px;
        top: 620px;
        width: 560px;
        opacity: 0;
        transform: translateY(10px);
        transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #poll.on {
        opacity: 1;
        transform: none;
      }
      #pq {
        font-size: 15px;
        color: var(--cream);
        letter-spacing: 0.06em;
        font-weight: 600;
        margin-bottom: 9px;
        text-shadow: 0 2px 8px #000;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }
      #pTime {
        font-size: 17px;
        color: var(--rune);
      }
      #pBar {
        height: 26px;
        display: flex;
        overflow: hidden;
        border: 1px solid rgba(169, 123, 255, 0.3);
        background: rgba(10, 6, 18, 0.72);
      }
      #pBar > div {
        display: flex;
        align-items: center;
        padding: 0 11px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        white-space: nowrap;
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
      }
      #pA {
        background: linear-gradient(90deg, var(--deep), var(--violet));
        color: var(--cream);
      }
      #pB {
        background: rgba(243, 238, 228, 0.9);
        color: var(--ink);
        justify-content: flex-end;
      }

      /* ─────────────────── SAFE-ZONE GUIDE (?guide=1) ─────────────────── */
      .zone {
        position: absolute;
        border: 1px dashed rgba(255, 80, 80, 0.8);
        background: rgba(255, 0, 0, 0.08);
        font-size: 12px;
        color: #fff;
        padding: 3px 6px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        display: none;
      }
      body.guide .zone {
        display: block;
      }
      /* ═══════════════════ AFK / BRB SCENE ═══════════════════
         A second OBS source loads this same file with ?mode=. The HUD source
         stays layered on top, so everything here keeps clear of its lanes:
           strip  x520–1040 y16–92     rail   x26–82  y132–812
           notice x26–200   y96–112    banner x470–1030 y620–822          */
      body.scene {
        background: #06040d;
      }
      /* the HUD belongs to the other source — this one draws only the scene */
      body.scene #rail,
      body.scene #strip,
      body.scene #poll,
      body.scene #oracle,
      body.scene #notice,
      body.scene .zone {
        display: none !important;
      }
      #scene {
        position: absolute;
        inset: 0;
        display: none;
      }
      body.scene #scene {
        display: block;
      }
      #sky {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #scene .layer {
        position: absolute;
        inset: 0;
      }

      /* ── status block (x150–1000, y240–540) ── */
      #scStatus {
        position: absolute;
        left: 150px;
        top: 250px;
        width: 850px;
      }
      #scKicker {
        font-size: 15px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--rune);
        font-weight: 600;
        margin-bottom: 14px;
        opacity: 0.9;
      }
      #scTitle {
        font-size: 92px;
        line-height: 0.94;
        font-weight: 700;
        color: var(--cream);
        letter-spacing: 0.01em;
        text-shadow: 0 6px 40px rgba(0, 0, 0, 0.8);
      }
      #scTimer {
        font-size: 128px;
        line-height: 1;
        font-weight: 700;
        color: var(--cream);
        margin-top: 18px;
        text-shadow: 0 0 50px rgba(122, 47, 242, 0.55);
      }
      #scTimer.over {
        font-size: 52px;
        color: var(--ember);
        animation: overPulse 2.6s ease-in-out infinite;
      }
      @keyframes overPulse {
        0%,
        100% {
          opacity: 0.72;
        }
        50% {
          opacity: 1;
        }
      }
      #scSub {
        margin-top: 20px;
        font-size: 19px;
        color: rgba(243, 238, 228, 0.55);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 600;
      }

      /* ── goal bars (x150–640, y870–1020) ── */
      #scGoals {
        position: absolute;
        left: 150px;
        top: 872px;
        width: 490px;
      }
      #scGoals .goal {
        margin-bottom: 17px;
      }
      #scGoals .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 12px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-weight: 600;
        color: rgba(243, 238, 228, 0.5);
        margin-bottom: 7px;
      }
      #scGoals .row b {
        color: var(--cream);
        font-size: 17px;
        font-weight: 700;
      }
      #scGoals .bar {
        height: 4px;
        background: rgba(243, 238, 228, 0.12);
        border-radius: 2px;
        overflow: hidden;
      }
      #scGoals .bar i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--deep), var(--violet), var(--rune));
        box-shadow: 0 0 12px rgba(122, 47, 242, 0.75);
        transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #scGoals .goal.done .bar i {
        background: linear-gradient(90deg, var(--violet), var(--ember));
        box-shadow: 0 0 16px rgba(232, 163, 61, 0.8);
      }
      #scGoals .goal.done .row b {
        color: var(--ember);
      }

      /* ── rotating prompt (x1150–1800, y880–1000) ── */
      #scPrompt {
        position: absolute;
        left: 1150px;
        top: 892px;
        width: 650px;
        text-align: right;
      }
      #scPromptLabel {
        font-size: 11px;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: rgba(243, 238, 228, 0.38);
        font-weight: 600;
        margin-bottom: 12px;
      }
      #scPromptText {
        font-size: 30px;
        color: var(--cream);
        font-weight: 500;
        line-height: 1.28;
        transition: opacity 0.5s, transform 0.5s;
      }
      #scPromptText b {
        color: var(--rune);
        font-weight: 700;
      }
      #scPromptText.out {
        opacity: 0;
        transform: translateY(-8px);
      }

      /* ─────────────────── OAUTH HELPER (one-off, not part of the stream) ─────────────────── */
      #oauthHelper {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 6, 18, 0.92);
        font-family: "Rajdhani", system-ui, sans-serif;
      }
      #oauthHelper .card {
        width: min(560px, 92vw);
        padding: 30px 34px;
        background: linear-gradient(
          180deg,
          rgba(61, 15, 138, 0.5),
          rgba(20, 6, 48, 0.85)
        );
        border: 1px solid rgba(169, 123, 255, 0.35);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75);
      }
      #oauthHelper h1 {
        font-size: 20px;
        color: #f3eee4;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 18px;
      }
      #oauthHelper label {
        display: block;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(243, 238, 228, 0.55);
        font-weight: 600;
        margin-top: 16px;
      }
      #oauthHelper input,
      #oauthHelper textarea {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 10px 12px;
        background: rgba(10, 6, 18, 0.6);
        border: 1px solid rgba(169, 123, 255, 0.3);
        color: #f3eee4;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 15px;
        border-radius: 2px;
      }
      #oauthHelper textarea {
        height: 76px;
        resize: none;
        word-break: break-all;
      }
      #oauthHelper button {
        margin-top: 18px;
        padding: 10px 22px;
        background: linear-gradient(90deg, #3d0f8a, #7a2ff2);
        color: #f3eee4;
        border: none;
        border-radius: 2px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-size: 12px;
        cursor: pointer;
      }
      #oauthHelper .hint {
        margin-top: 14px;
        font-size: 12px;
        color: rgba(243, 238, 228, 0.5);
        line-height: 1.5;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <!-- keep-out zones for alignment, toggle with ?guide=1 -->
      <div class="zone" style="left: 0; top: 0; width: 502px; height: 70px">
        buffs
      </div>
      <div
        class="zone"
        style="left: 1050px; top: 24px; width: 200px; height: 170px"
      >
        map info
      </div>
      <div
        class="zone"
        style="left: 1255px; top: 0; width: 665px; height: 1080px"
      >
        inventory / minimap

    <script>
      /* ═══════════════════════════════════════════════════════════════

      const CONFIG = {

        alertGap: 650, // ms of breathing room between two banners

        // ── AFK / BRB scene ──

        maxStars: 120, // chatter stars kept on screen before evicting
        starLabels: 8, // how many carry a visible name
        constellation: 6, // most-recent chatters linked by lines
        goalFollows: 10, // away-session targets
